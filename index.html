<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Exambro CBT Sekolah - Sistem Ujian Online Anti-Curang</title>

  <!-- PWA Manifest Data URI -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Exambro CBT Sekolah","short_name":"ExambroCBT","start_url":".","display":"fullscreen","background_color":"#f8fafc","theme_color":"#2563eb","orientation":"portrait"}' />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- SheetJS (Excel/CSV Parser & Exporter) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Mammoth.js (Word .docx Parser) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      box-sizing: border-box;
    }

    /* Fullscreen Wrapper - Tema Elegan & Fokus (Deep Navy -> Charcoal Blue -> Slate Blue) */
    #exambro-root {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: linear-gradient(135deg, #0a192f 0%, #1e293b 50%, #3b5978 100%);
      background-attachment: fixed;
      overflow-y: auto;
      overflow-x: hidden;
      color: #0f172a;
    }

    /* Kontras Otomatis untuk Judul Halaman di Atas Background Deep Navy -> Slate Blue */
    #admin-tab-container > div > div:first-child h1 {
      color: #f8fafc !important;
      text-shadow: 0 2px 10px rgba(10, 25, 47, 0.35);
    }
    #admin-tab-container > div > div:first-child p {
      color: #cbd5e1 !important;
    }

    /* Glassmorphism Surface yang menyatu dengan palet Deep Navy - Charcoal Blue - Slate Blue */
    .glass-card {
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.96);
      box-shadow: 0 12px 32px -6px rgba(10, 25, 47, 0.28), 0 4px 14px -2px rgba(30, 41, 59, 0.18);
    }

    /* Aksen Bayangan saat Perpindahan Antar Menu atau Antar Halaman (transform: none di akhir agar modal fixed tidak terpotong) */
    @keyframes shadowSweepTransition {
      0% {
        opacity: 0.82;
        transform: translateY(6px) scale(0.995);
        box-shadow: 0 28px 60px -12px rgba(10, 25, 47, 0.45), 0 14px 32px -8px rgba(59, 89, 120, 0.3);
      }
      60% {
        opacity: 1;
        transform: translateY(-1px) scale(1.001);
        box-shadow: 0 20px 42px -10px rgba(10, 25, 47, 0.25), 0 8px 20px -6px rgba(59, 89, 120, 0.18);
      }
      100% {
        opacity: 1;
        transform: none;
        box-shadow: 0 0 0 0 rgba(10, 25, 47, 0);
      }
    }

    .transition-shadow-accent {
      animation: shadowSweepTransition 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      border-radius: 1.5rem;
    }

    #page-shadow-veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999994;
      opacity: 0;
      background: radial-gradient(circle at 50% 35%, rgba(59, 89, 120, 0.12) 0%, rgba(10, 25, 47, 0.38) 100%);
      box-shadow: inset 0 0 120px rgba(10, 25, 47, 0.45);
      transition: opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #page-shadow-veil.active-veil {
      opacity: 1;
    }

    /* Pop-up Loading Simpel Modern (Deep Navy -> Charcoal Blue -> Slate Blue) */
    #loading-popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999997;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 25, 47, 0.42);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #loading-popup-overlay.show-loading {
      opacity: 1;
      pointer-events: auto;
    }
    .loading-card-modern {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.98) 0%, rgba(241, 245, 249, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.98);
      box-shadow: 0 24px 48px -12px rgba(10, 25, 47, 0.45), 0 8px 20px -4px rgba(30, 41, 59, 0.28);
      border-radius: 1.75rem;
      padding: 1.25rem 1.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      max-width: 18.5rem;
      text-align: center;
      transform: scale(0.92) translateY(8px);
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #loading-popup-overlay.show-loading .loading-card-modern {
      transform: scale(1) translateY(0);
    }
    .calm-spinner {
      width: 2.85rem;
      height: 2.85rem;
      border-radius: 9999px;
      background: conic-gradient(from 0deg, #0a192f, #1e293b, #3b5978, #60a5fa, #0a192f);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #000 0);
      mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #000 0);
      animation: spinCalm 0.85s linear infinite;
    }
    @keyframes spinCalm {
      to { transform: rotate(360deg); }
    }

    /* Pop-up Indikator Sukses (Hanya Logo Saja - Responsif & Non-Blocking) */
    #success-logo-popup {
      position: fixed;
      inset: 0;
      z-index: 9999998;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease;
    }
    #success-logo-popup.show-success-logo {
      opacity: 1;
    }
    .success-logo-badge {
      width: 5.4rem;
      height: 5.4rem;
      border-radius: 1.85rem;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(223, 236, 227, 0.96) 55%, rgba(243, 237, 226, 0.98) 100%);
      border: 2px solid rgba(92, 141, 118, 0.45);
      box-shadow: 0 24px 48px -10px rgba(59, 110, 140, 0.32), 0 0 0 10px rgba(223, 236, 227, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0.45);
      transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #success-logo-popup.show-success-logo .success-logo-badge {
      transform: scale(1);
    }
    .success-logo-inner {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 1.25rem;
      background: linear-gradient(135deg, #3b6e8c 0%, #4d8b6e 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      box-shadow: 0 8px 18px -4px rgba(59, 110, 140, 0.45);
    }

    /* EFEK TIMBUL SAAT KURSOR MENGARAH (HOVER LIFT 3D EFFECT) */
    .hover-lift {
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease, border-color 0.22s ease, background-color 0.2s ease;
    }
    .hover-lift:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 16px 32px -8px rgba(37, 99, 235, 0.16), 0 6px 14px -3px rgba(15, 23, 42, 0.08);
      border-color: rgba(59, 130, 246, 0.45);
    }
    .hover-lift:active {
      transform: translateY(-1px) scale(0.995);
    }

    /* Efek Timbul Khusus Tombol & Menu Navigasi Kiri */
    .nav-item-3d {
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .nav-item-3d:hover {
      transform: translateX(5px) translateY(-2px);
      box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.18), 0 3px 6px -2px rgba(15, 23, 42, 0.06);
    }
    .nav-item-3d.active-nav {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff !important;
      box-shadow: 0 10px 22px -4px rgba(37, 99, 235, 0.4);
      transform: translateX(3px);
    }

    /* Efek Timbul untuk Tombol Reguler */
    .btn-3d {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-3d:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.3), 0 4px 8px -2px rgba(15, 23, 42, 0.1);
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(0px);
    }

    /* Proteksi Anti-Copy & Anti-Screenshot Saat Ujian */
    .exam-protected {
      user-select: none !important;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Layout Responsif Sidebar Desktop vs Bottom Nav Mobile */
    @media (min-width: 1024px) {
      .admin-sidebar {
        display: flex !important;
      }
      .admin-bottom-nav {
        display: none !important;
      }
      .admin-main-content {
        margin-left: 18rem !important;
      }
    }
    @media (max-width: 1023px) {
      .admin-sidebar {
        display: none !important;
      }
      .admin-bottom-nav {
        display: flex !important;
      }
      .admin-main-content {
        margin-left: 0 !important;
        padding-bottom: 6.5rem !important;
      }
    }

    /* ==========================================================================
       DESAIN KARTU PESERTA UJIAN UKURAN STANDAR ID CARD / KTP (85.6mm x 54mm)
       ========================================================================== */
    .ktp-card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-start;
    }

    .ktp-exam-card {
      width: 85.6mm;
      height: 54mm;
      background: #ffffff;
      border: 1px solid #1e293b;
      border-radius: 2.5mm;
      padding: 2.2mm 2.8mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      color: #0f172a;
    }

    /* Print Styling untuk Kartu Ujian Ukuran KTP/ID Card di Kertas A4 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }
      body * {
        visibility: hidden;
      }
      #exambro-root {
        position: static !important;
        overflow: visible !important;
        background: #ffffff !important;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .ktp-card-grid {
        display: grid !important;
        grid-template-columns: repeat(2, 85.6mm) !important;
        gap: 4mm 6mm !important;
        justify-content: center !important;
      }
      .ktp-exam-card {
        width: 85.6mm !important;
        height: 54mm !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        border: 0.8pt solid #0f172a !important;
        box-shadow: none !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .a4-attendance-sheet {
        width: 100% !important;
        max-width: 100% !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }

    /* Lembar Daftar Hadir Standar Kertas A4 */
    .a4-attendance-sheet {
      width: 210mm;
      min-height: 297mm;
      background: #ffffff;
      color: #0f172a;
      padding: 12mm 14mm;
      margin: 0 auto;
      box-shadow: 0 12px 32px -4px rgba(15, 23, 42, 0.12);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    .attendance-table th,
    .attendance-table td {
      border: 1px solid #1e293b;
      padding: 5px 8px;
      font-size: 9.5pt;
    }
    .attendance-table th {
      background-color: #f1f5f9 !important;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="exambro-root">
    <!-- Konten dirender secara dinamis oleh JavaScript -->
  </div>

  <!-- Elemen Overlay Global (Bayangan Transisi, Pop-up Loading, Pop-up Logo Sukses & Dialog Konfirmasi) -->
  <div id="page-shadow-veil" class="no-print"></div>

  <div id="loading-popup-overlay" class="no-print" aria-live="polite">
    <div class="loading-card-modern">
      <div class="calm-spinner"></div>
      <div id="loading-popup-title" class="text-xs font-extrabold text-slate-800 tracking-wide">Memproses Data...</div>
      <div id="loading-popup-subtitle" class="text-[11px] font-semibold text-amber-700 bg-amber-50/90 border border-amber-200/80 px-2.5 py-1 rounded-xl hidden">
        <i class="fa-solid fa-wifi mr-1"></i>Sinyal kurang stabil, mohon tunggu...
      </div>
    </div>
  </div>

  <div id="success-logo-popup" class="no-print" aria-hidden="true">
    <div class="success-logo-badge">
      <div class="success-logo-inner">
        <i class="fa-solid fa-check"></i>
      </div>
    </div>
  </div>

  <div id="custom-dialog-overlay" class="hidden no-print fixed inset-0 z-[9999999] bg-slate-900/45 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-card bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 space-y-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center flex-shrink-0">
          <i id="custom-dialog-icon" class="fa-solid fa-circle-question text-lg"></i>
        </div>
        <h4 id="custom-dialog-title" class="text-sm font-extrabold text-slate-900">Konfirmasi Tindakan</h4>
      </div>
      <p id="custom-dialog-message" class="text-xs text-slate-600 leading-relaxed whitespace-pre-line"></p>
      <input id="custom-dialog-input" type="text" class="hidden w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" id="custom-dialog-cancel" class="btn-3d px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">Batal</button>
        <button type="button" id="custom-dialog-ok" class="btn-3d px-5 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold">Ya, Lanjutkan</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // ============================================================================
    // KONFIGURASI APLIKASI (SUDAH TERHUBUNG KE SUPABASE ANDA)
    // ============================================================================
    const IS_PREVIEW = false;
    const SUPABASE_URL = 'https://lphwwdqmgidvhnwpvdnz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_KD9o_q0AuSuJALD8Q_UlQg_3yvGsvRe';

    // ============================================================================
    // KONTROLER POP-UP LOADING, INDIKATOR LOGO SUKSES & AKSEN BAYANGAN TRANSISI
    // ============================================================================
    let activeRequestsCount = 0;
    let loadingShowTimer = null;
    let slowSignalTimer = null;
    let successLogoTimer = null;
    let shadowVeilTimer = null;

    function showLoadingPopup(customTitle = 'Memproses Data...', isUnstable = false) {
      const overlay = document.getElementById('loading-popup-overlay');
      const titleEl = document.getElementById('loading-popup-title');
      const subEl = document.getElementById('loading-popup-subtitle');
      if (!overlay) return;
      if (titleEl) titleEl.textContent = customTitle;
      if (subEl) {
        if (isUnstable || !navigator.onLine) {
          subEl.classList.remove('hidden');
        } else {
          subEl.classList.add('hidden');
        }
      }
      overlay.classList.add('show-loading');

      clearTimeout(slowSignalTimer);
      slowSignalTimer = setTimeout(() => {
        if (overlay.classList.contains('show-loading') && subEl) {
          subEl.classList.remove('hidden');
        }
      }, 2200);
    }

    function hideLoadingPopup() {
      clearTimeout(loadingShowTimer);
      clearTimeout(slowSignalTimer);
      const overlay = document.getElementById('loading-popup-overlay');
      const subEl = document.getElementById('loading-popup-subtitle');
      if (overlay && navigator.onLine) {
        overlay.classList.remove('show-loading');
      }
      if (subEl && navigator.onLine) {
        subEl.classList.add('hidden');
      }
    }

    // Pop-up Indikator Sukses (Hanya Logo Saja) untuk Penambahan / Perubahan Data Penting
    function showSuccessLogoPopup() {
      const popup = document.getElementById('success-logo-popup');
      if (!popup) return;
      clearTimeout(successLogoTimer);
      popup.classList.add('show-success-logo');
      successLogoTimer = setTimeout(() => {
        popup.classList.remove('show-success-logo');
      }, 950);
    }

    // Aksen Bayangan Halus Saat Berpindah Menu atau Halaman
    function triggerTransitionShadow() {
      const veil = document.getElementById('page-shadow-veil');
      if (veil) {
        clearTimeout(shadowVeilTimer);
        veil.classList.add('active-veil');
        shadowVeilTimer = setTimeout(() => {
          veil.classList.remove('active-veil');
        }, 250);
      }
      requestAnimationFrame(() => {
        const target = document.getElementById('admin-tab-container')
          || document.getElementById('exam-protected-container')
          || document.querySelector('#exambro-root > div');
        if (target) {
          target.classList.remove('transition-shadow-accent');
          void target.offsetWidth;
          target.classList.add('transition-shadow-accent');
        }
      });
    }

    // Dialog Konfirmasi & Input Kustom (Menggantikan confirm/prompt bawaan agar responsif)
    function customConfirm(message, title = 'Konfirmasi Tindakan') {
      return new Promise((resolve) => {
        const overlay = document.getElementById('custom-dialog-overlay');
        const titleEl = document.getElementById('custom-dialog-title');
        const msgEl = document.getElementById('custom-dialog-message');
        const inputEl = document.getElementById('custom-dialog-input');
        const btnOk = document.getElementById('custom-dialog-ok');
        const btnCancel = document.getElementById('custom-dialog-cancel');
        if (!overlay) return resolve(true);

        titleEl.textContent = title;
        msgEl.textContent = message;
        inputEl.classList.add('hidden');
        overlay.classList.remove('hidden');

        const cleanup = (val) => {
          overlay.classList.add('hidden');
          btnOk.onclick = null;
          btnCancel.onclick = null;
          resolve(val);
        };
        btnOk.onclick = () => cleanup(true);
        btnCancel.onclick = () => cleanup(false);
      });
    }

    function customPrompt(message, defaultValue = '', title = 'Input Data') {
      return new Promise((resolve) => {
        const overlay = document.getElementById('custom-dialog-overlay');
        const titleEl = document.getElementById('custom-dialog-title');
        const msgEl = document.getElementById('custom-dialog-message');
        const inputEl = document.getElementById('custom-dialog-input');
        const btnOk = document.getElementById('custom-dialog-ok');
        const btnCancel = document.getElementById('custom-dialog-cancel');
        if (!overlay) return resolve(defaultValue);

        titleEl.textContent = title;
        msgEl.textContent = message;
        inputEl.value = defaultValue;
        inputEl.classList.remove('hidden');
        overlay.classList.remove('hidden');
        setTimeout(() => inputEl.focus(), 50);

        const cleanup = (val) => {
          overlay.classList.add('hidden');
          inputEl.classList.add('hidden');
          btnOk.onclick = null;
          btnCancel.onclick = null;
          resolve(val);
        };
        btnOk.onclick = () => cleanup(inputEl.value);
        btnCancel.onclick = () => cleanup(null);
      });
    }

    // Pantau Koneksi Sinyal Internet (Offline / Online) Secara Otomatis
    window.addEventListener('offline', () => {
      showLoadingPopup('Koneksi Terputus', true);
    });
    window.addEventListener('online', () => {
      hideLoadingPopup();
      showToast('Koneksi internet kembali stabil', 'info');
    });

    // Fetch Wrapper Pintar untuk Supabase (Otomatis Munculkan Loading Saat Menunggu / Sinyal Lambat)
    const trackedFetch = async (...args) => {
      activeRequestsCount++;
      if (activeRequestsCount === 1) {
        clearTimeout(loadingShowTimer);
        loadingShowTimer = setTimeout(() => {
          if (activeRequestsCount > 0) {
            showLoadingPopup('Memuat & Menyinkronkan...');
          }
        }, 160);
      }
      try {
        const response = await window.fetch(...args);
        return response;
      } catch (err) {
        showLoadingPopup('Sinyal tidak stabil, mencoba kembali...', true);
        setTimeout(() => {
          if (activeRequestsCount === 0) hideLoadingPopup();
        }, 1400);
        throw err;
      } finally {
        activeRequestsCount = Math.max(0, activeRequestsCount - 1);
        if (activeRequestsCount === 0) {
          hideLoadingPopup();
        }
      }
    };

    const supabase = (!IS_PREVIEW && SUPABASE_URL && SUPABASE_URL.startsWith('http'))
      ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          global: { fetch: trackedFetch }
        })
      : null;

    // Default Pengaturan Desain Kartu Peserta Ujian (Ukuran KTP / ID Card)
    const defaultCardConfig = {
      id: null,
      dinas_name: 'PEMERINTAH KABUPATEN / KOTA - DINAS PENDIDIKAN',
      school_name: 'SMP NEGERI 1 SEKOLAH STANDAR NASIONAL',
      school_address: 'Jl. Pendidikan Raya No. 01, Telp. (021) 123456',
      logo_left: '',
      logo_right: '',
      card_title: 'KARTU PESERTA UJIAN',
      card_subtitle: 'Asesmen Sumatif Akhir Semester Ganjil T.A 2026/2027',

            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', () => {});
          `;
          const blob = new Blob([swCode], { type: 'application/javascript' });

          navigator.serviceWorker.register(swUrl).catch(() => {});
        }
      } catch (e) {}

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Format Tanggal Otomatis ke DD-MM-YYYY untuk Daftar Hadir & Seluruh Fitur
    function formatDateDDMMYYYY(dateInput) {
      if (!dateInput || dateInput === '-') return '-';
      const str = String(dateInput).trim();
      // Jika sudah format DD-MM-YYYY
      if (/^\d{2}-\d{2}-\d{4}$/.test(str)) return str;
      // Jika format YYYY-MM-DD (dari input type="date")
      const ymdMatch = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (ymdMatch) {
        return `${ymdMatch[3]}-${ymdMatch[2]}-${ymdMatch[1]}`;
      }
      // Jika format YYYY/MM/DD
      const slashMatch = str.match(/^(\d{4})\/(\d{2})\/(\d{2})/);
      if (slashMatch) {
        return `${slashMatch[3]}-${slashMatch[2]}-${slashMatch[1]}`;
      }
      // Fallback parsing objek Date
      const parsed = new Date(str);
      if (!isNaN(parsed.getTime())) {
        const dd = String(parsed.getDate()).padStart(2, '0');
        const mm = String(parsed.getMonth() + 1).padStart(2, '0');
        const yyyy = parsed.getFullYear();
        return `${dd}-${mm}-${yyyy}`;
      }
      return str;
    }

    function playWarningBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(640, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.45);
      } catch (e) {}
    }

    // Menentukan tingkat kelas ('VII' | 'VIII' | 'IX' | 'Semua') dari paket jadwal ujian
    function getExamGradeLevel(exam) {
      if (!exam) return 'Semua';
      const tc = String(exam.target_class || '').toUpperCase().trim();
      if (tc.includes('VIII') || tc.startsWith('8')) return 'VIII';
      if (tc.includes('IX') || tc.startsWith('9')) return 'IX';
      if (tc.includes('VII') || tc.startsWith('7')) return 'VII';

      const subObj = state.subjects.find(s => s.name === exam.subject);
      if (subObj && ['VII', 'VIII', 'IX'].includes(subObj.level)) {
        return subObj.level;
      }
      const titleUpper = String(exam.title || '').toUpperCase();
      if (titleUpper.includes('VIII')) return 'VIII';
      if (titleUpper.includes('IX')) return 'IX';
      if (titleUpper.includes('VII')) return 'VII';
      return 'Semua';
    }

    // Fungsi Pengacak Array Deterministik (Berbasis Seed Siswa + Ujian agar konsisten jika halaman di-refresh saat ujian)
    function seededShuffle(array, seedStr) {
      const arr = [...array];
      let h = 2166136261 >>> 0;
      for (let i = 0; i < seedStr.length; i++) {
        h ^= seedStr.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      function nextRand() {
        h += h << 13; h ^= h >>> 7;
        h += h << 3;  h ^= h >>> 17;
        h += h << 5;
        return ((h >>> 0) % 100000) / 100000;
      }
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(nextRand() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Membangun daftar soal & pemetaan opsi ABCD untuk siswa (mendukung Acak Soal & Acak Opsi/Kunci Jawaban)
    function buildPreparedQuestionsForStudent(rawQuestions, exam, studentId) {
      const sorted = [...rawQuestions].sort((a, b) => (a.order_number || 0) - (b.order_number || 0));
      const orderedQuestions = exam.shuffle_questions
        ? seededShuffle(sorted, `${studentId}-${exam.id}-q`)
        : sorted;

      return orderedQuestions.map((q) => {
        const baseOptions = [
          { origKey: 'A', text: q.option_a },
          { origKey: 'B', text: q.option_b },
          { origKey: 'C', text: q.option_c },
          { origKey: 'D', text: q.option_d }
        ];
        const finalOptions = exam.shuffle_options
          ? seededShuffle(baseOptions, `${studentId}-${q.id}-opt`)
          : baseOptions;

        const letters = ['A', 'B', 'C', 'D'];
        const displayOptions = finalOptions.map((item, idx) => ({
          displayLetter: letters[idx],
          origKey: item.origKey,
          text: item.text
        }));

        return {
          ...q,
          displayOptions
        };
      });
    }

    function getLocalExamStorageKey(sessionId) {
      return `exambro_local_answers_v1_${sessionId}`;

    function saveExamProgressLocal() {
      if (!state.activeSession || !state.activeSession.id) return;
      try {
        const payload = {
          sessionId: state.activeSession.id,
          examId: state.activeExam?.id || state.activeSession.exam_id,
          studentId: state.currentUser?.id || state.activeSession.student_id,
          answers: state.activeSession.answers || {},
          doubtfulQuestions: state.doubtfulQuestions || {},
          remainingSeconds: state.remainingSeconds || 0,
          updatedAt: Date.now()
        };
        localStorage.setItem(getLocalExamStorageKey(state.activeSession.id), JSON.stringify(payload));
      } catch (e) {}
    }

    function loadExamProgressLocal(session, defaultDurationSeconds) {
      if (!session || !session.id) {
        return { answers: session?.answers || {}, doubtfulQuestions: {}, remainingSeconds: defaultDurationSeconds };
      }
      try {
        const raw = localStorage.getItem(getLocalExamStorageKey(session.id));
        if (!raw) {
          return { answers: session.answers || {}, doubtfulQuestions: {}, remainingSeconds: defaultDurationSeconds };
        }
        const parsed = JSON.parse(raw);
        const mergedAnswers = { ...(session.answers || {}), ...(parsed.answers || {}) };
        const doubtfulQuestions = parsed.doubtfulQuestions || {};
        const remainingSeconds = (typeof parsed.remainingSeconds === 'number' && parsed.remainingSeconds > 0)
          ? parsed.remainingSeconds
          : defaultDurationSeconds;
        return { answers: mergedAnswers, doubtfulQuestions, remainingSeconds };
      } catch (e) {
        return { answers: session.answers || {}, doubtfulQuestions: {}, remainingSeconds: defaultDurationSeconds };
      }
    }

    function clearExamProgressLocal(sessionId) {
      if (!sessionId) return;
      try {
        localStorage.removeItem(getLocalExamStorageKey(sessionId));
      } catch (e) {}
    }

    // TAMPILAN CETAK & EKSPOR PDF DAFTAR HADIR PESERTA UJIAN (STANDAR KERTAS A4)
    // ============================================================================
    function renderAttendanceSheetView(container) {
      const exam = state.exams.find(e => e.id === state.attendanceExamId) || state.exams[0];
      if (!exam) {
        state.attendanceExamId = null;
        renderAdminSchedulesTab(container);
        return;
      }

      const cfg = state.cardConfig || defaultCardConfig;
      const period = getActiveAcademicPeriod();

      // Filter siswa aktif berdasarkan kelas pada jadwal atau filter rombel yang dipilih
      const studentsInSchedule = state.students.filter(s => {
        if (s.is_archived) return false;
        if (state.attendanceClassFilter !== 'ALL') {
          return s.class_name === state.attendanceClassFilter;
        }
        const tc = exam.target_class || 'Semua';
        if (tc === 'Semua') return true;
        if (tc === 'Semua VII') return s.class_name.startsWith('VII.');
        if (tc === 'Semua VIII') return s.class_name.startsWith('VIII.');
        if (tc === 'Semua IX') return s.class_name.startsWith('IX.');
        return s.class_name === tc;
      });

      const classLabel = state.attendanceClassFilter !== 'ALL'
        ? state.attendanceClassFilter
        : (exam.target_class || 'Semua Kelas');

      container.innerHTML = `
        <div class="space-y-5">
          <!-- Bar Navigasi & Kontrol Cetak / Ekspor PDF (Disembunyikan saat Cetak) -->
          <div class="no-print glass-card p-4 rounded-2xl flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-3 border border-blue-200">
            <div class="flex flex-wrap items-center gap-2.5">

              </button>
              <div>
                <div class="text-xs font-extrabold text-blue-600 uppercase">Dokumen Standar A4 Siap Cetak / PDF</div>
                <div class="text-sm font-extrabold text-slate-900">Daftar Hadir Peserta Ujian</div>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              <div>

    function renderStudentExamSheet(root) {
      const q = state.activeQuestions[state.currentQuestionIndex];
      const answers = state.activeSession?.answers || {};
      const selectedOrigKey = q ? answers[q.id] : null;
      const answeredCount = Object.keys(answers).length;
      const mins = String(Math.floor(state.remainingSeconds / 60)).padStart(2, '0');
      const secs = String(state.remainingSeconds % 60).padStart(2, '0');

      const optionsToRender = (q && q.displayOptions) ? q.displayOptions : (q ? [
        { displayLetter: 'A', origKey: 'A', text: q.option_a },
        { displayLetter: 'B', origKey: 'B', text: q.option_b },
        { displayLetter: 'C', origKey: 'C', text: q.option_c },
        { displayLetter: 'D', origKey: 'D', text: q.option_d }
      ] : []);

      root.innerHTML = `
        <div id="exam-protected-container" class="exam-protected min-h-screen flex flex-col justify-between p-3 sm:p-5 max-w-4xl mx-auto select-none">
          <!-- Top Bar Exambro -->
          <div class="glass-card rounded-2xl p-3.5 mb-3 flex flex-wrap items-center justify-between gap-2">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-extrabold text-blue-600 uppercase">${escapeHtml(state.activeExam.subject)}</span>
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-50 border border-emerald-200 text-[10px] font-bold text-emerald-700" title="Jawaban disimpan instan di memori perangkat dan dikirim saat selesai">
                  <i class="fa-solid fa-bolt"></i> Tersimpan Lokal (${answeredCount}/${state.activeQuestions.length})
                </span>
              </div>
              <div class="text-xs text-slate-600 font-bold truncate max-w-[180px] sm:max-w-xs">${escapeHtml(state.currentUser.name)} (${escapeHtml(state.currentUser.class_name)})</div>
            </div>
            <div class="flex items-center gap-2">
              <div class="px-3 py-1.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-xs font-bold">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i>${state.activeSession.violation_count}/${state.activeExam.max_violations || 3}
              </div>
              <div class="px-3.5 py-1.5 rounded-xl bg-slate-900 text-white font-mono font-extrabold text-sm">
                <i class="fa-regular fa-clock mr-1 text-blue-400"></i><span id="exam-timer-display">${mins}:${secs}</span>
              </div>
            </div>
          </div>

          <!-- Kartu Soal Utama -->
          ${!q ? `
            <div class="glass-card rounded-3xl p-8 text-center text-slate-500">Soal belum tersedia pada jadwal ujian ini.</div>
          ` : `
            <div class="glass-card rounded-3xl p-5 sm:p-7 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-4">
                  <span class="px-3.5 py-1.5 rounded-xl bg-blue-600 text-white text-xs font-extrabold">
                    SOAL NOMOR ${state.currentQuestionIndex + 1} DARI ${state.activeQuestions.length}
                  </span>
                  <button onclick="window.app.toggleDoubtful('${q.id}')" class="btn-3d px-3 py-1.5 rounded-xl text-xs font-bold ${state.doubtfulQuestions[q.id] ? 'bg-amber-400 text-slate-900' : 'bg-slate-100 text-slate-600'}">
                    <i class="fa-solid fa-flag mr-1"></i>Ragu-ragu
                  </button>
                </div>

                <div class="text-sm sm:text-base font-semibold text-slate-900 leading-relaxed whitespace-pre-line mb-4">${escapeHtml(q.question_text)}</div>

                ${q.image_url ? `
                  <div class="mb-4">
                    <img src="${q.image_url}" alt="Ilustrasi Soal" class="max-h-64 rounded-2xl border border-slate-200 mx-auto object-contain" />
                  </div>
                ` : ''}

                <!-- Pilihan Jawaban ABCD -->
                <div class="space-y-2.5 mt-4">
                  ${optionsToRender.map(opt => {
                    const isPicked = selectedOrigKey === opt.origKey;
                    return `
                      <button type="button" onclick="window.app.selectAnswer('${q.id}', '${opt.origKey}')" class="hover-lift w-full text-left p-3.5 sm:p-4 rounded-2xl border-2 transition flex items-center gap-3.5 ${isPicked ? 'bg-blue-600 text-white border-blue-600 shadow-lg shadow-blue-600/25' : 'bg-white text-slate-800 border-slate-200 hover:border-blue-400'}">
                        <span class="w-8 h-8 rounded-xl flex items-center justify-center font-extrabold text-xs ${isPicked ? 'bg-white text-blue-600' : 'bg-slate-100 text-slate-700'}">${opt.displayLetter}</span>
                        <span class="text-xs sm:text-sm font-semibold flex-1">${escapeHtml(opt.text)}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- Navigasi Sebelumnya / Selanjutnya -->
              <div class="flex items-center justify-between gap-3 mt-6 pt-4 border-t border-slate-200/80">
                <button onclick="window.app.navigateQuestion(-1)" ${state.currentQuestionIndex === 0 ? 'disabled' : ''} class="btn-3d px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold disabled:opacity-40">
                  <i class="fa-solid fa-arrow-left mr-1.5"></i>Sebelumnya
                </button>

                ${state.currentQuestionIndex < state.activeQuestions.length - 1 ? `
                  <button onclick="window.app.navigateQuestion(1)" class="btn-3d px-5 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-extrabold">
                    Selanjutnya<i class="fa-solid fa-arrow-right ml-1.5"></i>
                  </button>
                ` : `
                  <button onclick="window.app.confirmSubmitExam()" class="btn-3d px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold shadow-lg shadow-emerald-600/30">
                    <i class="fa-solid fa-paper-plane mr-1.5"></i>Selesai & Kirim Jawaban
                  </button>
                `}
              </div>
            </div>
          `}

          <!-- Grid Nomor Soal -->
          <div class="glass-card rounded-2xl p-3.5 mt-3">
            <div class="text-[11px] font-bold text-slate-500 mb-2">Navigasi Nomor Soal:</div>
            <div class="flex flex-wrap gap-1.5">
              ${state.activeQuestions.map((item, idx) => {
                const answered = answers[item.id];
                const doubtful = state.doubtfulQuestions[item.id];
                const isCurr = idx === state.currentQuestionIndex;
                const cls = isCurr
                  ? 'ring-2 ring-blue-600 bg-blue-600 text-white'
                  : doubtful
                  ? 'bg-amber-400 text-slate-900'
                  : answered
                  ? 'bg-emerald-500 text-white'
                  : 'bg-white border border-slate-200 text-slate-700';
                return `
                  <button onclick="window.app.jumpToQuestion(${idx})" class="btn-3d w-9 h-9 rounded-xl text-xs font-extrabold flex items-center justify-center ${cls}">
                    ${idx + 1}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ============================================================================
    // SISTEM ANTI-CURANG (DETEKSI PINDAH TAB, BLUR, FULLSCREEN, SCREENSHOT)
    // ============================================================================
    function attachAntiCheatListeners() {
      if (state.antiCheatAttached) return;
      state.antiCheatAttached = true;

      document.addEventListener('contextmenu', (e) => {
        if (state.role === 'student' && state.activeExam) e.preventDefault();
      });

      document.addEventListener('keydown', (e) => {
        if (state.role === 'student' && state.activeExam) {
          if (e.key === 'PrintScreen' || (e.ctrlKey && ['c', 'u', 'p', 's'].includes(e.key.toLowerCase()))) {
            e.preventDefault();
            triggerAntiCheatViolation('Terdeteksi menekan tombol terlarang / Screenshot');
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (state.role === 'student' && state.activeExam && document.hidden) {
          triggerAntiCheatViolation('Berpindah tab atau meminimalkan aplikasi ujian');
        }
      });

      window.addEventListener('blur', () => {
        if (state.role === 'student' && state.activeExam) {
          triggerAntiCheatViolation('Keluar dari fokus layar ujian (Split Screen / Notifikasi)');
        }
      });

      document.addEventListener('fullscreenchange', () => {
        if (state.role === 'student' && state.activeExam && !document.fullscreenElement) {
          triggerAntiCheatViolation('Keluar dari mode Layar Penuh (Fullscreen)');
        }
      });
    }

    async function triggerAntiCheatViolation(reason) {
      if (!state.activeExam || !state.activeSession || state.violationLockout) return;
      state.violationLockout = true;
      setTimeout(() => { state.violationLockout = false; }, 1500);

      playWarningBeep();
      state.activeSession.violation_count = (state.activeSession.violation_count || 0) + 1;
      const maxV = state.activeExam.max_violations || 3;

      saveExamProgressLocal();

      if (state.activeSession.violation_count >= maxV) {
        state.activeSession.status = 'blocked';
        if (!IS_PREVIEW && supabase) {
          await supabase.from('exam_sessions').update({
            answers: state.activeSession.answers || {},
            violation_count: state.activeSession.violation_count,
            status: 'blocked'
          }).eq('id', state.activeSession.id);
        }
        clearInterval(state.examTimerInterval);
        state.activeExam = null;
        showToast('Ujian Anda dikunci otomatis karena melampaui batas pelanggaran pindah layar!', 'error');
        renderApp();
        return;
      }

      if (!IS_PREVIEW && supabase) {
        await supabase.from('exam_sessions').update({
          violation_count: state.activeSession.violation_count
        }).eq('id', state.activeSession.id);
      }

      showToast(`Peringatan Anti-Curang (${state.activeSession.violation_count}/${maxV}): ${reason}`, 'warning');
      renderApp();
    }

        const name = document.getElementById('form-student-name').value.trim();

      async deleteAllStudents() {
        const targetStudents = state.students.filter(s => {
          const matchStatus = state.studentFilters.archived === 'ARCHIVED' ? s.is_archived : !s.is_archived;
          const matchClass = state.studentFilters.className === 'ALL' || s.class_name === state.studentFilters.className;
          const q = state.studentFilters.search.toLowerCase().trim();
          const matchQuery = !q || s.name.toLowerCase().includes(q) || s.nisn.toLowerCase().includes(q) || (s.username && s.username.toLowerCase().includes(q));
          return matchStatus && matchClass && matchQuery;
        });

        if (targetStudents.length === 0) {
          showToast('Tidak ada data siswa untuk dihapus.', 'warning');
          return;
        }

        const scopeLabel = state.studentFilters.className !== 'ALL'
          ? `seluruh siswa pada Kelas ${state.studentFilters.className} (${targetStudents.length} siswa)`
          : `SELURUH DATA SISWA (${targetStudents.length} siswa)`;

        const ok = await customConfirm(
          `PERINGATAN KERAS!\n\nApakah Anda yakin ingin MENGHAPUS ${scopeLabel} secara permanen?\n\nTindakan ini juga akan menghapus riwayat sesi ujian siswa terkait dan TIDAK DAPAT DIBATALKAN!`,
          'Peringatan Hapus Semua Siswa'
        );
        if (!ok) return;

        showLoadingPopup('Menghapus Semua Data Siswa...');
        try {
          const targetIds = targetStudents.map(s => s.id);
          if (IS_PREVIEW) {
            state.students = state.students.filter(s => !targetIds.includes(s.id));
            state.exam_sessions = state.exam_sessions.filter(ses => !targetIds.includes(ses.student_id));
          } else {
            // Hapus secara bertahap (per 100 ID) agar aman dari batas panjang URL Supabase
            const chunkSize = 100;
            for (let i = 0; i < targetIds.length; i += chunkSize) {
              const batch = targetIds.slice(i, i + chunkSize);
              const { error } = await supabase.from('students').delete().in('id', batch);
              if (error) throw error;
            }
            await loadAllAdminData();
          }
          showToast(`Berhasil menghapus ${targetStudents.length} data siswa secara permanen.`, 'success');
          renderApp();
        } catch (err) {
          showToast('Gagal menghapus semua siswa: ' + err.message, 'error');
        } finally {
          hideLoadingPopup();
        }
      },

      downloadStudentTemplate() {
        const headers = ['NO', 'NISN', 'NAMA_LENGKAP', 'JENIS_KELAMIN', 'KELAS', 'NOMOR_UJIAN'];
        const sampleRows = [
          [1, '0091122334', 'Budi Pratama', 'L', 'VII.1', '26-VII1-001'],
          [2, '0095566778', 'Siti Aminah', 'P', 'VIII.1', '26-VIII1-002'],
          [3, '0098877665', 'Ahmad Fauzan', 'L', 'IX.1', '26-IX1-003']
        ];

        const ws = XLSX.utils.aoa_to_sheet([headers, ...sampleRows]);

        // Kunci format kolom NISN, KELAS, dan NOMOR_UJIAN sebagai Teks ('@') agar angka 0 di depan NISN tidak hilang di Excel
        const range = XLSX.utils.decode_range(ws['!ref']);
        for (let R = 1; R <= range.e.r; ++R) {
          ['B', 'E', 'F'].forEach(col => {
            const cellAddress = `${col}${R + 1}`;
            if (ws[cellAddress]) {
              ws[cellAddress].t = 's';
              ws[cellAddress].z = '@';
            }
          });
        }

        // Atur lebar kolom agar rapi dan mudah diisi oleh Admin
        ws['!cols'] = [
          { wch: 6 },  // NO
          { wch: 16 }, // NISN
          { wch: 32 }, // NAMA_LENGKAP
          { wch: 16 }, // JENIS_KELAMIN
          { wch: 12 }, // KELAS
          { wch: 18 }  // NOMOR_UJIAN
        ];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Template_Siswa');
        XLSX.writeFile(wb, 'Template_Impor_Siswa_Exambro.xlsx');
        showToast('Template Excel Siswa berhasil diunduh!', 'info');
      },

      importStudentsExcel(e) {
        const fileInput = e.target;
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;

        showLoadingPopup('Membaca & Mengimpor File Siswa...');
        const reader = new FileReader();

        reader.onload = async (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, { type: 'array', raw: false });
            const firstSheetName = wb.SheetNames[0];
            const sheet = wb.Sheets[firstSheetName];

            // Baca sebagai matriks baris 2D agar tahan terhadap spasi/perbedaan nama kolom header
            const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            if (!matrix || matrix.length === 0) {
              showToast('File Excel/CSV kosong atau tidak terbaca.', 'warning');
              return;
            }

            // Cari baris header secara pintar di 10 baris pertama
            let headerRowIndex = -1;
            let colMap = { nisn: -1, name: -1, gender: -1, className: -1, examNum: -1 };

            for (let r = 0; r < Math.min(matrix.length, 10); r++) {
              const rowCells = matrix[r].map(c => String(c || '').toLowerCase().replace(/[^a-z0-9]/g, ''));
              const nisnIdx = rowCells.findIndex(c => c === 'nisn' || c.includes('nisn') || c === 'username' || c === 'nis' || c === 'nomorinduk');
              const nameIdx = rowCells.findIndex(c => c.includes('nama') || c === 'name' || c === 'peserta' || c === 'siswa');

              if (nisnIdx !== -1 && nameIdx !== -1) {
                headerRowIndex = r;
                colMap.nisn = nisnIdx;
                colMap.name = nameIdx;
                colMap.gender = rowCells.findIndex(c => c === 'jk' || c.includes('kelamin') || c === 'lp' || c === 'gender' || c === 'sex');
                colMap.className = rowCells.findIndex(c => c.includes('kelas') || c.includes('rombel') || c === 'class');
                colMap.examNum = rowCells.findIndex(c => c.includes('nomorujian') || c.includes('noujian') || c.includes('nopeserta') || c.includes('nomorpeserta'));
                break;
              }
            }

            // Jika header tidak ditemukan, gunakan urutan kolom standar (A=NISN, B=NAMA, C=JK, D=KELAS atau A=NO, B=NISN, C=NAMA, D=JK, E=KELAS)
            let startRow = headerRowIndex !== -1 ? headerRowIndex + 1 : 0;
            if (headerRowIndex === -1) {
              const firstRow = matrix[0] || [];
              const firstCell = String(firstRow[0] || '').trim();
              if (/^\d{1,3}$/.test(firstCell) && firstRow.length >= 4) {
                colMap = { nisn: 1, name: 2, gender: 3, className: 4, examNum: 5 };
              } else {
                colMap = { nisn: 0, name: 1, gender: 2, className: 3, examNum: 4 };
              }
            }

            // Helper normalisasi penulisan kelas (misal "7.1" -> "VII.1", "Kelas IX-2" -> "IX.2")
            const normalizeClassName = (rawCls) => {
              let cl = String(rawCls || '').toUpperCase().trim();
              if (!cl) return state.classes[0]?.class_name || 'VII.1';
              cl = cl.replace(/^KELAS\s+/i, '').replace(/\s+/g, '').replace('-', '.');
              cl = cl.replace(/^7\./, 'VII.').replace(/^8\./, 'VIII.').replace(/^9\./, 'IX.');
              cl = cl.replace(/^7([1-9])$/, 'VII.$1').replace(/^8([1-9])$/, 'VIII.$1').replace(/^9([1-9])$/, 'IX.$1');
              return cl;
            };

            const newStudents = [];
            let skipped = 0;
            const activeYear = getActiveAcademicPeriod().year_name;

            for (let r = startRow; r < matrix.length; r++) {
              const row = matrix[r];
              if (!row || row.length === 0) continue;

              // Bersihkan tanda kutip atau spasi pada NISN
              let rawNisn = String(row[colMap.nisn] ?? '').trim().replace(/^['`]+/, '').replace(/\s+/g, '');
              const name = String(row[colMap.name] ?? '').trim();

              if (!rawNisn || !name) continue;
              // Lewati jika baris ini masih merupakan teks judul/header
              if (rawNisn.toLowerCase() === 'nisn' || name.toLowerCase().includes('nama lengkap')) continue;

              // Jika NISN berupa angka 7-9 digit (karena angka 0 di depan terpotong oleh Excel), tambahkan 0 di depan hingga 10 digit
              if (/^\d{7,9}$/.test(rawNisn)) {
                rawNisn = rawNisn.padStart(10, '0');
              }

              // Cek duplikat NISN
              if (state.students.some(s => s.nisn === rawNisn) || newStudents.some(s => s.nisn === rawNisn)) {
                skipped++;
                continue;
              }

              // Normalisasi Jenis Kelamin (L / P)
              const rawGender = colMap.gender !== -1 ? String(row[colMap.gender] ?? 'L').trim().toUpperCase() : 'L';
              const gender = (rawGender.startsWith('P') || rawGender.startsWith('W')) ? 'P' : 'L';

              // Normalisasi Kelas
              const rawClass = colMap.className !== -1 ? row[colMap.className] : 'VII.1';
              const class_name = normalizeClassName(rawClass);

              // Nomor Ujian
              const rawExamNum = colMap.examNum !== -1 ? String(row[colMap.examNum] ?? '').trim() : '';
              const exam_number = rawExamNum || `26-${class_name.replace(/[^A-Z0-9]/g, '')}-${rawNisn.slice(-3)}`;

              newStudents.push({
                nisn: rawNisn,
                name,
                gender,
                class_name,
                username: rawNisn,
                password: 'siswa123',
                exam_number,
                is_active: true,
                can_take_exam: true,
                is_archived: false,
                academic_year: activeYear
              });
            }

            if (newStudents.length === 0) {
              if (skipped > 0) {
                showToast(`Seluruh siswa pada file (${skipped} siswa) sudah terdaftar di aplikasi.`, 'warning');
              } else {
                showToast('Tidak ditemukan data siswa yang valid. Pastikan kolom NISN dan Nama Lengkap terisi.', 'error');
              }
              return;
            }

            // Simpan ke Database Supabase secara bertahap (batch) agar stabil
            if (IS_PREVIEW) {
              newStudents.forEach((ns, i) => state.students.push({ id: 'std-imp-' + Date.now() + '-' + i, ...ns }));
            } else {
              const chunkSize = 100;
              for (let i = 0; i < newStudents.length; i += chunkSize) {
                const batch = newStudents.slice(i, i + chunkSize);
                const { error } = await supabase.from('students').insert(batch);
                if (error) throw error;
              }
              await loadAllAdminData();
            }

            showToast(
              `Berhasil mengimpor ${newStudents.length} siswa baru!` + (skipped > 0 ? ` (${skipped} NISN duplikat dilewati)` : ''),
              'success'
            );
            renderApp();
          } catch (err) {
            showToast('Gagal mengimpor file siswa: ' + err.message, 'error');
          } finally {
            fileInput.value = '';
            hideLoadingPopup();
          }
        };

        reader.onerror = () => {
          fileInput.value = '';
          hideLoadingPopup();
          showToast('Gagal membaca file yang dipilih.', 'error');
        };

        reader.readAsArrayBuffer(file);
      },

      async confirmRulesAndProceed() {
        if (!state.rulesCheckboxChecked) return;
        state.rulesAccepted = true;
        state.showRulesModal = false;
        const targetExamId = state.pendingExamIdForRules;
        state.pendingExamIdForRules = null;

        if (targetExamId) {

      async startStudentExam(examId) {
        if (!state.rulesAccepted) {
          window.app.openRulesModal(examId);
          return;
        }

        const ex = state.exams.find(e => e.id === examId);
        if (!ex) return;

        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen().catch(() => {});
        }

        let rawQuestions = [];
        if (IS_PREVIEW) {
          rawQuestions = state.questions
            .filter(q => q.exam_id === examId)
            .sort((a, b) => (a.order_number || 0) - (b.order_number || 0));
        } else {
          const { data } = await supabase
            .from('questions')
            .select('*')
            .eq('exam_id', examId)
            .order('order_number', { ascending: true });
          rawQuestions = data || [];
        }

        let session = state.exam_sessions.find(s => s.student_id === state.currentUser.id && s.exam_id === examId);
        if (!session) {
          const newSes = {
            student_id: state.currentUser.id,
            exam_id: examId,
            answers: {},
            score: null,
            violation_count: 0,
            status: 'in_progress',
            started_at: new Date().toISOString()
          };
          if (IS_PREVIEW) {
            session = { id: 'ses-' + Date.now(), ...newSes };
            state.exam_sessions.push(session);
          } else {
            const { data } = await supabase.from('exam_sessions').insert([newSes]).select().single();
            session = data;
            state.exam_sessions.push(session);
          }
        }

        state.activeExam = ex;
        // Terapkan Acak Soal dan/atau Acak Opsi Kunci Jawaban sesuai pengaturan paket ujian
        state.activeQuestions = buildPreparedQuestionsForStudent(rawQuestions, ex, state.currentUser.id);

        // Pulihkan pilihan jawaban & sisa waktu dari penyimpanan lokal perangkat (localStorage) jika ada
        const defaultDurationSeconds = (ex.duration_minutes || 60) * 60;
        const localProgress = loadExamProgressLocal(session, defaultDurationSeconds);
        session.answers = localProgress.answers;
        state.activeSession = session;
        state.doubtfulQuestions = localProgress.doubtfulQuestions;
        state.currentQuestionIndex = 0;
        state.remainingSeconds = localProgress.remainingSeconds;
        saveExamProgressLocal();

        attachAntiCheatListeners();
        if (state.examTimerInterval) clearInterval(state.examTimerInterval);
        state.examTimerInterval = setInterval(() => {
          state.remainingSeconds--;
          if (state.remainingSeconds % 5 === 0) {
            saveExamProgressLocal();
          }
          const timerEl = document.getElementById('exam-timer-display');
          if (timerEl) {
            const m = String(Math.floor(state.remainingSeconds / 60)).padStart(2, '0');
            const s = String(state.remainingSeconds % 60).padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
          }
          if (state.remainingSeconds <= 0) {
            clearInterval(state.examTimerInterval);
            window.app.submitExamNow();
          }
        }, 1000);

        renderApp();
        triggerTransitionShadow();
      },

        // Simpan instan ke memori & localStorage perangkat siswa (tanpa request ke Supabase per klik)
        state.activeSession.answers = { ...state.activeSession.answers, [questionId]: origOptionLetter };

      async confirmSubmitExam() {
        const answeredCount = Object.keys(state.activeSession?.answers || {}).length;
        const total = state.activeQuestions.length;
        const ok = await customConfirm(`Anda telah menjawab ${answeredCount} dari ${total} soal.\nYakin ingin mengakhiri ujian dan mengirim jawaban sekarang?`, 'Kirim Jawaban Ujian');
        if (!ok) return;
        window.app.submitExamNow();
      },

      async submitExamNow() {
        if (!state.activeSession || !state.activeExam) return;
        clearInterval(state.examTimerInterval);

        const answers = state.activeSession.answers || {};
        let correct = 0;
        state.activeQuestions.forEach(q => {
          if (answers[q.id] === q.correct_option) correct++;
        });
        const total = state.activeQuestions.length || 1;
        const score = Math.round((correct / total) * 100);
        const submittedAt = new Date().toISOString();

        // Simpan ke localStorage terlebih dahulu sebagai cadangan aman
        saveExamProgressLocal();

        if (!IS_PREVIEW && supabase) {
          showLoadingPopup('Mengirim Jawaban Ujian ke Server...');
          try {
            const { error } = await supabase.from('exam_sessions').update({
              answers,
              score,
              status: 'completed',
              submitted_at: submittedAt
            }).eq('id', state.activeSession.id);

            if (error) throw error;
          } catch (err) {
            hideLoadingPopup();
            showToast('Sinyal kurang stabil saat mengirim jawaban. Jawaban Anda aman tersimpan di perangkat, silakan klik Selesai & Kirim Jawaban sekali lagi.', 'warning');
            return;
          } finally {
            hideLoadingPopup();
          }
        }

        state.activeSession.score = score;
        state.activeSession.status = 'completed';
        state.activeSession.submitted_at = submittedAt;

        // Bersihkan cache lokal sesi setelah berhasil terkirim ke database Supabase
        clearExamProgressLocal(state.activeSession.id);

        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }

        state.activeExam = null;
        showToast('Jawaban ujian Anda berhasil dikirim!', 'success');
        renderApp();
      }
    };

    // Parser Teks Soal dari Word (.docx/.doc) & Google Form
    async function parseStructuredQuestionsText(rawText) {
      if (!rawText || !state.selectedExamId) return;
      const blocks = rawText.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
      const existingCount = state.questions.filter(q => q.exam_id === state.selectedExamId).length;
      const newQuestions = [];

      blocks.forEach((block) => {
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
        if (lines.length < 5) return;
        const qText = lines[0].replace(/^\d+[\.\)]\s*/, '');
        let a = '', b = '', c = '', d = '', key = 'A';
        lines.slice(1).forEach(line => {
          if (/^A[\.\)]\s*/i.test(line)) a = line.replace(/^A[\.\)]\s*/i, '');
          else if (/^B[\.\)]\s*/i.test(line)) b = line.replace(/^B[\.\)]\s*/i, '');
          else if (/^C[\.\)]\s*/i.test(line)) c = line.replace(/^C[\.\)]\s*/i, '');
          else if (/^D[\.\)]\s*/i.test(line)) d = line.replace(/^D[\.\)]\s*/i, '');
          else if (/^(KUNCI|JAWABAN|KEY)\s*[:=]\s*/i.test(line)) {
            key = line.replace(/^(KUNCI|JAWABAN|KEY)\s*[:=]\s*/i, '').trim().toUpperCase().charAt(0) || 'A';
          }
        });
        if (qText && a && b) {
          newQuestions.push({
            exam_id: state.selectedExamId,
            order_number: existingCount + newQuestions.length + 1,
            question_text: qText,
            image_url: '',
            option_a: a,
            option_b: b,
            option_c: c || '-',
            option_d: d || '-',
            correct_option: ['A', 'B', 'C', 'D'].includes(key) ? key : 'A'
          });
        }
      });

      if (newQuestions.length > 0) {
        if (IS_PREVIEW) {
          newQuestions.forEach((nq, i) => state.questions.push({ id: 'q-imp-' + Date.now() + '-' + i, ...nq }));
        } else {
          await supabase.from('questions').insert(newQuestions);
          await loadAllAdminData();
        }
        showToast(`Berhasil mengimpor ${newQuestions.length} butir soal!`, 'success');
        renderApp();
      } else {
        showToast('Format soal tidak dikenali. Pastikan terdapat opsi A, B, C, D dan KUNCI.', 'warning');
      }
    }

    // Inisialisasi Aplikasi & Cek Sesi Login Admin
    async function bootstrapApp() {
      registerDynamicPWA();
      if (!IS_PREVIEW && supabase) {
        try {
          const { data } = await supabase.auth.getSession();
          if (data?.session?.user) {
            state.role = 'admin';
            state.currentUser = data.session.user;
            await loadAllAdminData();
          }
        } catch (e) {}
      }
      renderApp();
    }

    bootstrapApp();
  </script>
</body>
</html>
