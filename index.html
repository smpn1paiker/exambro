<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Exambro CBT Sekolah - Sistem Ujian Online Anti-Curang</title>

  <!-- PWA Manifest Data URI -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Exambro CBT Sekolah","short_name":"ExambroCBT","start_url":".","display":"fullscreen","background_color":"#f8fafc","theme_color":"#2563eb","orientation":"portrait"}' />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- SheetJS (Excel/CSV Parser & Exporter) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Mammoth.js (Word .docx Parser) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      box-sizing: border-box;
    }

    /* Fullscreen Wrapper */
    #exambro-root {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 50%, #f1f5f9 100%);
      overflow-y: auto;
      overflow-x: hidden;
      color: #0f172a;
    }

    /* Glassmorphism Surface */
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
    }

    /* EFEK TIMBUL SAAT KURSOR MENGARAH (HOVER LIFT 3D EFFECT) */
    .hover-lift {
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease, border-color 0.22s ease, background-color 0.2s ease;
    }
    .hover-lift:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 16px 32px -8px rgba(37, 99, 235, 0.16), 0 6px 14px -3px rgba(15, 23, 42, 0.08);
      border-color: rgba(59, 130, 246, 0.45);
    }
    .hover-lift:active {
      transform: translateY(-1px) scale(0.995);
    }

    /* Efek Timbul Khusus Tombol & Menu Navigasi Kiri */
    .nav-item-3d {
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .nav-item-3d:hover {
      transform: translateX(5px) translateY(-2px);
      box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.18), 0 3px 6px -2px rgba(15, 23, 42, 0.06);
    }
    .nav-item-3d.active-nav {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff !important;
      box-shadow: 0 10px 22px -4px rgba(37, 99, 235, 0.4);
      transform: translateX(3px);
    }

    /* Efek Timbul untuk Tombol Reguler */
    .btn-3d {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-3d:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.3), 0 4px 8px -2px rgba(15, 23, 42, 0.1);
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(0px);
    }

    /* Proteksi Anti-Copy & Anti-Screenshot Saat Ujian */
    .exam-protected {
      user-select: none !important;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Layout Responsif Sidebar Desktop vs Bottom Nav Mobile */
    @media (min-width: 1024px) {
      .admin-sidebar {
        display: flex !important;
      }
      .admin-bottom-nav {
        display: none !important;
      }
      .admin-main-content {
        margin-left: 18rem !important;
      }
    }
    @media (max-width: 1023px) {
      .admin-sidebar {
        display: none !important;
      }
      .admin-bottom-nav {
        display: flex !important;
      }
      .admin-main-content {
        margin-left: 0 !important;
        padding-bottom: 6.5rem !important;
      }
    }

    /* Print Styling untuk Kartu Ujian */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .exam-card-print {
        break-inside: avoid;
        page-break-inside: avoid;
        border: 1.5px solid #1e293b !important;
        margin-bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="exambro-root">
    <!-- Konten dirender secara dinamis oleh JavaScript -->
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // ============================================================================
    // KONFIGURASI APLIKASI (SUDAH TERHUBUNG KE SUPABASE ANDA)
    // ============================================================================
    const IS_PREVIEW = false;
    const SUPABASE_URL = 'https://lphwwdqmgidvhnwpvdnz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_KD9o_q0AuSuJALD8Q_UlQg_3yvGsvRe';

    const supabase = (!IS_PREVIEW && SUPABASE_URL && SUPABASE_URL.startsWith('http'))
      ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    // ============================================================================
    // STATE GLOBAL
    // ============================================================================
    const state = {
      role: null, // 'admin' | 'student' | null
      currentUser: null,
      adminTab: 'dashboard', // 'dashboard' | 'master-students' | 'master-classes' | 'master-subjects' | 'master-teachers' | 'master-periods' | 'master-accounts' | 'schedules' | 'exams' | 'results'
      masterMenuOpen: true, // Buka grup sub-menu Data Master di sidebar kiri
      selectedExamId: null,
      studentFilters: {
        search: '',
        className: 'ALL',
        archived: 'ACTIVE'
      },
      classFilterLevel: 'ALL',
      subjectSearch: '',
      teacherSearch: '',
      scheduleFilterClass: 'ALL',
      accountFilters: {
        search: '',
        className: 'ALL'
      },
      // State Ujian Siswa (Exambro)
      activeExam: null,
      activeQuestions: [],
      activeSession: null,
      currentQuestionIndex: 0,
      doubtfulQuestions: {},
      examTimerInterval: null,
      remainingSeconds: 0,
      antiCheatAttached: false,
      violationLockout: false,

      // Koleksi Data
      academic_years: [],
      classes: [],
      subjects: [],
      teachers: [],
      students: [],
      exams: [],
      questions: [],
      exam_sessions: []
    };

    // ============================================================================
    // INISIALISASI PWA DINAMIS (1 FILE SERVICE WORKER)
    // ============================================================================
    function registerDynamicPWA() {
      try {
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', () => {});
          `;
          const blob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(blob);
          navigator.serviceWorker.register(swUrl).catch(() => {});
        }
      } catch (e) {}
    }

    // ============================================================================
    // UTILITAS UMUM & NOTIFIKASI TOAST
    // ============================================================================
    function showToast(message, type = 'info') {
      const existing = document.getElementById('toast-container');
      if (existing) existing.remove();

      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-500',
        warning: 'bg-amber-500 text-white border-amber-400',
        info: 'bg-blue-600 text-white border-blue-500'
      };
      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-exclamation',
        warning: 'fa-triangle-exclamation',
        info: 'fa-circle-info'
      };

      const div = document.createElement('div');
      div.id = 'toast-container';
      div.className = `fixed top-4 right-4 z-[9999999] flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border ${colors[type] || colors.info} transition-all duration-300`;
      div.innerHTML = `
        <i class="fa-solid ${icons[type] || icons.info} text-lg"></i>
        <span class="text-sm font-semibold">${escapeHtml(message)}</span>
      `;
      document.getElementById('exambro-root').appendChild(div);
      setTimeout(() => {
        if (div.parentNode) div.remove();
      }, 3400);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function playWarningBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(640, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.45);
      } catch (e) {}
    }

    function getActiveAcademicPeriod() {
      const active = state.academic_years.find(a => a.is_active);
      return active ? active : { year_name: '2026/2027', semester: 'Ganjil' };
    }

    // ============================================================================
    // SINKRONISASI DATA SUPABASE
    // ============================================================================
    async function loadAllAdminData() {
      if (IS_PREVIEW || !supabase) return;

      try {
        const [
          ayRes,
          clsRes,
          subRes,
          tchRes,
          stdRes,
          exRes,
          qRes,
          sesRes
        ] = await Promise.all([
          supabase.from('academic_years').select('*').order('created_at', { ascending: false }),
          supabase.from('classes').select('*').order('class_name', { ascending: true }),
          supabase.from('subjects').select('*').order('code', { ascending: true }),
          supabase.from('teachers').select('*').order('name', { ascending: true }),
          supabase.from('students').select('*').order('class_name', { ascending: true }).order('name', { ascending: true }),
          supabase.from('exams').select('*').order('created_at', { ascending: false }),
          supabase.from('questions').select('*').order('order_number', { ascending: true }),
          supabase.from('exam_sessions').select('*').order('started_at', { ascending: false })
        ]);

        if (ayRes.data) state.academic_years = ayRes.data;
        if (clsRes.data) state.classes = clsRes.data;
        if (subRes.data) state.subjects = subRes.data;
        if (tchRes.data) state.teachers = tchRes.data;
        if (stdRes.data) state.students = stdRes.data;
        if (exRes.data) state.exams = exRes.data;
        if (qRes.data) state.questions = qRes.data;
        if (sesRes.data) state.exam_sessions = sesRes.data;

        if (state.classes.length === 0) {
          await seedDefaultClassesIfEmpty();
        }

        if (!state.selectedExamId && state.exams.length > 0) {
          state.selectedExamId = state.exams[0].id;
        }
      } catch (err) {
        showToast('Gagal memuat data dari server: ' + err.message, 'error');
      }
    }

    async function seedDefaultClassesIfEmpty() {
      if (IS_PREVIEW || !supabase) return;
      const defaultClasses = [
        { level: 'VII', class_name: 'VII.1', academic_year: '2026/2027' },
        { level: 'VII', class_name: 'VII.2', academic_year: '2026/2027' },
        { level: 'VII', class_name: 'VII.3', academic_year: '2026/2027' },
        { level: 'VII', class_name: 'VII.4', academic_year: '2026/2027' },
        { level: 'VIII', class_name: 'VIII.1', academic_year: '2026/2027' },
        { level: 'VIII', class_name: 'VIII.2', academic_year: '2026/2027' },
        { level: 'VIII', class_name: 'VIII.3', academic_year: '2026/2027' },
        { level: 'VIII', class_name: 'VIII.4', academic_year: '2026/2027' },
        { level: 'IX', class_name: 'IX.1', academic_year: '2026/2027' },
        { level: 'IX', class_name: 'IX.2', academic_year: '2026/2027' },
        { level: 'IX', class_name: 'IX.3', academic_year: '2026/2027' },
        { level: 'IX', class_name: 'IX.4', academic_year: '2026/2027' },
        { level: 'IX', class_name: 'IX.5', academic_year: '2026/2027' }
      ];
      const { data } = await supabase.from('classes').insert(defaultClasses).select();
      if (data) state.classes = data;
    }

    // ============================================================================
    // RENDER UTAMA
    // ============================================================================
    function renderApp() {
      const root = document.getElementById('exambro-root');
      if (!root) return;

      if (!state.role) {
        renderLoginScreen(root);
      } else if (state.role === 'admin') {
        renderAdminLayout(root);
      } else if (state.role === 'student') {
        renderStudentView(root);
      }
    }

    // ============================================================================
    // 1. HALAMAN LOGIN (BERSIH TANPA TOMBOL QUICK LOGIN)
    // ============================================================================
    function renderLoginScreen(root) {
      root.innerHTML = `
        <div class="min-h-screen flex flex-col justify-center items-center p-4">
          <div class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 border border-white/80 shadow-xl">
            <div class="text-center mb-6">
              <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/30 hover-lift">
                <i class="fa-solid fa-shield-halved text-2xl"></i>
              </div>
              <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Exambro CBT Sekolah</h1>

            <!-- Tab Pilih Akses Siswa / Admin -->

              <button type="button" id="tab-btn-admin" onclick="window.app.switchLoginTab('admin')" class="btn-3d py-2.5 text-xs sm:text-sm font-bold rounded-xl text-slate-600 hover:text-slate-900">
                <i class="fa-solid fa-user-shield mr-1.5"></i>Admin / Panitia

            </div>

            <!-- Form Login Siswa -->
            <form id="form-login-student" onsubmit="window.app.handleStudentLogin(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">NISN Peserta (10 Digit)</label>
                <div class="relative">
                  <i class="fa-solid fa-id-card absolute left-3.5 top-3.5 text-slate-400"></i>
                  <input type="text" id="student-nisn" required maxlength="15" placeholder="Masukkan 10 digit NISN" class="w-full pl-10 pr-4 py-3 rounded-xl bg-white border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />

              </div>
              <div>

                  <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400"></i>
                  <input type="password" id="student-password" required placeholder="Masukkan kata sandi ujian" class="w-full pl-10 pr-4 py-3 rounded-xl bg-white border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
              </div>

              <div class="p-3 rounded-xl bg-blue-50/80 border border-blue-100 text-xs text-blue-800 space-y-1">
                <div class="font-bold flex items-center gap-1.5"><i class="fa-solid fa-mobile-screen-button"></i> Perhatian Mode Exambro:</div>
                <p class="text-[11px] leading-relaxed">Aplikasi otomatis mengaktifkan <strong>Layar Penuh (Fullscreen)</strong> dan mengunci perpindahan tab/aplikasi selama ujian berlangsung.</p>
              </div>

              <button type="submit" class="btn-3d w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-sm shadow-lg shadow-blue-600/25">
                <i class="fa-solid fa-right-to-bracket mr-2"></i>Masuk Ruang Ujian
              </button>
            </form>

            <!-- Form Login Admin -->
            <form id="form-login-admin" onsubmit="window.app.handleAdminLogin(event)" class="space-y-4 hidden">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Email Admin</label>
                <div class="relative">
                  <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400"></i>
                  <input type="email" id="admin-email" required placeholder="admin@sekolah.sch.id" class="w-full pl-10 pr-4 py-3 rounded-xl bg-white border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password Admin</label>
                <div class="relative">
                  <i class="fa-solid fa-key absolute left-3.5 top-3.5 text-slate-400"></i>
                  <input type="password" id="admin-password" required placeholder="Masukkan password admin" class="w-full pl-10 pr-4 py-3 rounded-xl bg-white border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
              </div>
              <button type="submit" class="btn-3d w-full py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow-lg">
                <i class="fa-solid fa-shield-halved mr-2"></i>Masuk Panel Admin
              </button>
            </form>
          </div>
          <p class="text-xs text-slate-400 mt-5 text-center">Exambro Sekolah &bull; Sistem Penilaian Berbasis Smartphone & Komputer</p>
        </div>
      `;
    }

    // ============================================================================
    // 2. LAYOUT PANEL ADMIN (SIDEBAR KIRI DENGAN SUB-MENU DATA MASTER & JADWAL UJIAN)
    // ============================================================================
    function renderAdminLayout(root) {
      const period = getActiveAcademicPeriod();
      const isMasterSub = state.adminTab.startsWith('master-');

      const masterSubItems = [
        { id: 'master-students', icon: 'fa-user-graduate', label: 'Data Siswa' },
        { id: 'master-classes', icon: 'fa-chalkboard', label: 'Data Kelas' },
        { id: 'master-subjects', icon: 'fa-book-open', label: 'Mata Pelajaran' },
        { id: 'master-teachers', icon: 'fa-chalkboard-user', label: 'Guru Pengampu' },
        { id: 'master-periods', icon: 'fa-calendar-check', label: 'Tahun Ajaran & Semester' },
        { id: 'master-accounts', icon: 'fa-id-badge', label: 'Pengaturan Peserta & Akun' }
      ];

      root.innerHTML = `
        <div class="min-h-screen flex flex-col lg:flex-row">
          <!-- FIXED SIDEBAR SEBELAH KIRI (DESKTOP) -->
          <aside class="admin-sidebar fixed top-0 left-0 bottom-0 w-72 glass-card border-r border-slate-200/80 flex-col justify-between p-4 z-30 overflow-y-auto">
            <div>
              <!-- Brand Header -->
              <div class="flex items-center gap-3 px-2 py-2 mb-4 border-b border-slate-200/70 pb-4">

                  <i class="fa-solid fa-graduation-cap text-lg"></i>
                </div>
                <div>
                  <h2 class="font-extrabold text-slate-900 text-base leading-tight">Panel Admin CBT</h2>

                    TA ${escapeHtml(period.year_name)} &bull; ${escapeHtml(period.semester)}
                  </span>
                </div>
              </div>

              <!-- Menu Navigasi Utama -->
              <nav class="space-y-1.5">
                <!-- Monitoring & Dashboard -->
                <button onclick="window.app.setAdminTab('dashboard')" class="nav-item-3d w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold ${state.adminTab === 'dashboard' ? 'active-nav' : 'text-slate-700 hover:bg-white'}">
                  <i class="fa-solid fa-desktop w-5 text-center text-sm"></i>
                  <span>Monitoring & Dashboard</span>
                </button>

                <!-- Grup Menu DATA MASTER di Sidebar Kiri -->
                <div class="pt-1">
                  <button onclick="window.app.toggleMasterMenu()" class="nav-item-3d w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-extrabold ${isMasterSub ? 'bg-blue-50 text-blue-700 border border-blue-200' : 'text-slate-800 hover:bg-white'}">
                    <span class="flex items-center gap-3">
                      <i class="fa-solid fa-database w-5 text-center text-sm text-blue-600"></i>
                      <span>Data Master</span>
                    </span>
                    <i class="fa-solid fa-chevron-${state.masterMenuOpen ? 'down' : 'right'} text-[10px]"></i>
                  </button>

                  <!-- Daftar Tombol Sub-Menu Data Master -->
                  <div class="${state.masterMenuOpen ? 'block' : 'hidden'} mt-1.5 ml-3 pl-3 border-l-2 border-blue-200 space-y-1">
                    ${masterSubItems.map(item => `
                      <button onclick="window.app.setAdminTab('${item.id}')" class="nav-item-3d w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold ${state.adminTab === item.id ? 'active-nav' : 'text-slate-600 hover:bg-white hover:text-blue-600'}">
                        <i class="fa-solid ${item.icon} w-4 text-center"></i>
                        <span class="truncate">${item.label}</span>
                      </button>
                    `).join('')}
                  </div>

    // ============================================================================
    // SISTEM ANTI-CURANG (DETEKSI PINDAH TAB, BLUR, FULLSCREEN, SCREENSHOT)
    // ============================================================================
    function attachAntiCheatListeners() {
      if (state.antiCheatAttached) return;
      state.antiCheatAttached = true;

      document.addEventListener('contextmenu', (e) => {
        if (state.role === 'student' && state.activeExam) e.preventDefault();
      });

      document.addEventListener('keydown', (e) => {
        if (state.role === 'student' && state.activeExam) {
          if (e.key === 'PrintScreen' || (e.ctrlKey && ['c', 'u', 'p', 's'].includes(e.key.toLowerCase()))) {
            e.preventDefault();
            triggerAntiCheatViolation('Terdeteksi menekan tombol terlarang / Screenshot');
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (state.role === 'student' && state.activeExam && document.hidden) {
          triggerAntiCheatViolation('Berpindah tab atau meminimalkan aplikasi ujian');
        }
      });

      window.addEventListener('blur', () => {
        if (state.role === 'student' && state.activeExam) {
          triggerAntiCheatViolation('Keluar dari fokus layar ujian (Split Screen / Notifikasi)');
        }
      });

      document.addEventListener('fullscreenchange', () => {
        if (state.role === 'student' && state.activeExam && !document.fullscreenElement) {
          triggerAntiCheatViolation('Keluar dari mode Layar Penuh (Fullscreen)');
        }
      });
    }

    async function triggerAntiCheatViolation(reason) {
      if (!state.activeExam || !state.activeSession || state.violationLockout) return;
      state.violationLockout = true;
      setTimeout(() => { state.violationLockout = false; }, 1500);

      playWarningBeep();
      state.activeSession.violation_count = (state.activeSession.violation_count || 0) + 1;
      const maxV = state.activeExam.max_violations || 3;

      if (state.activeSession.violation_count >= maxV) {
        state.activeSession.status = 'blocked';
        if (!IS_PREVIEW && supabase) {
          await supabase.from('exam_sessions').update({
            violation_count: state.activeSession.violation_count,
            status: 'blocked'
          }).eq('id', state.activeSession.id);
        }
        clearInterval(state.examTimerInterval);
        state.activeExam = null;
        showToast('Ujian Anda dikunci otomatis karena melampaui batas pelanggaran pindah layar!', 'error');
        renderApp();
        return;
      }

      if (!IS_PREVIEW && supabase) {
        await supabase.from('exam_sessions').update({
          violation_count: state.activeSession.violation_count
        }).eq('id', state.activeSession.id);
      }

      showToast(`Peringatan Anti-Curang (${state.activeSession.violation_count}/${maxV}): ${reason}`, 'warning');
      renderApp();
    }

      async handleStudentLogin(e) {
        e.preventDefault();
        const nisn = document.getElementById('student-nisn').value.trim();
        const password = document.getElementById('student-password').value.trim();

        if (IS_PREVIEW) {
          const std = state.students.find(s => (s.nisn === nisn || s.username === nisn) && s.password === password && !s.is_archived);
          if (!std) {
            showToast('NISN atau Kata Sandi tidak sesuai!', 'error');
            return;
          }
          if (std.is_active === false || std.can_take_exam === false) {
            showToast('Akun ujian Anda sedang dinonaktifkan oleh Panitia.', 'warning');
            return;
          }
          state.role = 'student';
          state.currentUser = std;
          renderApp();
          return;
        }

        try {
          const { data: std, error } = await supabase
            .from('students')
            .select('*')
            .or(`nisn.eq.${nisn},username.eq.${nisn}`)
            .eq('password', password)
            .eq('is_archived', false)
            .maybeSingle();

          if (error || !std) {
            showToast('NISN atau Kata Sandi salah!', 'error');
            return;
          }
          if (std.is_active === false || std.can_take_exam === false) {
            showToast('Status akun Anda belum diizinkan mengikuti ujian.', 'warning');
            return;
          }

          const [exRes, sesRes] = await Promise.all([
            supabase.from('exams').select('*').eq('is_active', true),
            supabase.from('exam_sessions').select('*').eq('student_id', std.id)
          ]);
          if (exRes.data) state.exams = exRes.data;
          if (sesRes.data) state.exam_sessions = sesRes.data;

          state.role = 'student';
          state.currentUser = std;
          renderApp();
        } catch (err) {
          showToast('Gagal menghubungi server ujian: ' + err.message, 'error');
        }
      },

      importStudentsExcel(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          const wb = XLSX.read(evt.target.result, { type: 'binary' });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
          const newStudents = [];
          let skipped = 0;

          for (const r of rows) {
            const nisn = String(r.NISN || r.nisn || '').trim();
            const name = String(r.NAMA || r.Nama || r.name || '').trim();
            const gender = String(r.JK || r.gender || 'L').trim().toUpperCase();
            const class_name = String(r.KELAS || r.Kelas || r.class_name || 'IX.1').trim();
            if (!nisn || !name) continue;

            if (state.students.some(s => s.nisn === nisn) || newStudents.some(s => s.nisn === nisn)) {
              skipped++;
              continue;
            }
            newStudents.push({
              nisn,
              name,
              gender: gender === 'P' ? 'P' : 'L',
              class_name,
              username: nisn,
              password: 'siswa123',
              exam_number: String(r.NOMOR_UJIAN || `26-${class_name.replace('.', '')}-${nisn.slice(-3)}`),
              is_active: true,
              can_take_exam: true,
              is_archived: false,
              academic_year: getActiveAcademicPeriod().year_name
            });
          }

          if (newStudents.length > 0) {
            if (IS_PREVIEW) {
              newStudents.forEach((ns, i) => state.students.push({ id: 'std-imp-' + Date.now() + '-' + i, ...ns }));
            } else {
              await supabase.from('students').insert(newStudents);
              await loadAllAdminData();
            }
          }
          showToast(`Berhasil mengimpor ${newStudents.length} siswa (${skipped} duplikat dilewati)`, 'success');
          renderApp();
        };
        reader.readAsBinaryString(file);
      },

          ex.is_active = nextStatus;
        } else {
          await supabase.from('exams').update({ is_active: nextStatus }).eq('id', id);
          await loadAllAdminData();
        }
        showToast(`Jadwal "${ex.title}" ${nextStatus ? 'DIAKTIFKAN' : 'DINONAKTIFKAN'}`, nextStatus ? 'success' : 'warning');
        renderApp();
      },

      async deleteSchedule(id) {
        if (!confirm('Hapus jadwal ujian ini beserta soal di dalamnya?')) return;
        if (IS_PREVIEW) {
          state.exams = state.exams.filter(e => e.id !== id);
          state.questions = state.questions.filter(q => q.exam_id !== id);
        } else {
          await supabase.from('exams').delete().eq('id', id);
          await loadAllAdminData();
        }
        showToast('Jadwal ujian dihapus', 'info');
        renderApp();
      },

      manageExamQuestions(examId) {
        state.selectedExamId = examId;
        state.adminTab = 'exams';
        renderApp();
      },

      // ----------------- MANAJEMEN BANK SOAL & IMPOR -----------------
      selectExamForQuestions(examId) {
        state.selectedExamId = examId;
        renderApp();
      },

      openQuestionModal(id = null) {
        if (!state.selectedExamId) {
          showToast('Pilih atau buat Jadwal Ujian terlebih dahulu!', 'warning');
          return;
        }
        document.getElementById('modal-question').classList.remove('hidden');
        const previewDiv = document.getElementById('question-image-preview');
        if (id) {
          const q = state.questions.find(x => x.id === id);
          document.getElementById('form-question-id').value = q.id;
          document.getElementById('form-question-order').value = q.order_number || 1;
          document.getElementById('form-question-key').value = q.correct_option || 'A';
          document.getElementById('form-question-text').value = q.question_text;
          document.getElementById('form-question-image').value = q.image_url || '';
          document.getElementById('form-question-a').value = q.option_a;
          document.getElementById('form-question-b').value = q.option_b;
          document.getElementById('form-question-c').value = q.option_c;
          document.getElementById('form-question-d').value = q.option_d;
          previewDiv.innerHTML = q.image_url ? `<img src="${q.image_url}" class="h-24 rounded-xl border" />` : '';
        } else {
          const nextOrder = state.questions.filter(q => q.exam_id === state.selectedExamId).length + 1;
          document.getElementById('form-question-id').value = '';
          document.getElementById('form-question-order').value = nextOrder;
          document.getElementById('form-question-text').value = '';
          document.getElementById('form-question-image').value = '';
          document.getElementById('form-question-a').value = '';
          document.getElementById('form-question-b').value = '';
          document.getElementById('form-question-c').value = '';
          document.getElementById('form-question-d').value = '';
          previewDiv.innerHTML = '';
        }
      },

      handleQuestionImageUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          document.getElementById('form-question-image').value = evt.target.result;
          document.getElementById('question-image-preview').innerHTML = `<img src="${evt.target.result}" class="h-24 rounded-xl border" />`;
        };
        reader.readAsDataURL(file);
      },

      async saveQuestion(e) {
        e.preventDefault();
        const id = document.getElementById('form-question-id').value;
        const payload = {
          exam_id: state.selectedExamId,
          order_number: parseInt(document.getElementById('form-question-order').value, 10) || 1,
          question_text: document.getElementById('form-question-text').value.trim(),
          image_url: document.getElementById('form-question-image').value,
          option_a: document.getElementById('form-question-a').value.trim(),
          option_b: document.getElementById('form-question-b').value.trim(),
          option_c: document.getElementById('form-question-c').value.trim(),
          option_d: document.getElementById('form-question-d').value.trim(),
          correct_option: document.getElementById('form-question-key').value
        };

        if (IS_PREVIEW) {
          if (id) {
            const idx = state.questions.findIndex(q => q.id === id);
            state.questions[idx] = { ...state.questions[idx], ...payload };
          } else {
            state.questions.push({ id: 'q-' + Date.now(), ...payload });
          }
        } else {
          if (id) await supabase.from('questions').update(payload).eq('id', id);
          else await supabase.from('questions').insert([payload]);
          await loadAllAdminData();
        }
        document.getElementById('modal-question').classList.add('hidden');
        showToast('Butir soal berhasil disimpan', 'success');
        renderApp();
      },

      async deleteQuestion(id) {
        if (!confirm('Hapus butir soal ini?')) return;
        if (IS_PREVIEW) state.questions = state.questions.filter(q => q.id !== id);
        else {
          await supabase.from('questions').delete().eq('id', id);
          await loadAllAdminData();
        }
        renderApp();
      },

      downloadQuestionTemplate() {
        const ws = XLSX.utils.json_to_sheet([
          { NO: 1, SOAL: 'Hasil dari 12 x 5 adalah...', OPSI_A: '50', OPSI_B: '60', OPSI_C: '70', OPSI_D: '80', KUNCI: 'B' },
          { NO: 2, SOAL: 'Ibu kota Provinsi Sumatera Selatan adalah...', OPSI_A: 'Palembang', OPSI_B: 'Padang', OPSI_C: 'Medan', OPSI_D: 'Jambi', KUNCI: 'A' }
        ]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Bank_Soal');
        XLSX.writeFile(wb, 'Template_Soal_PG_Exambro.xlsx');
      },

      importQuestionsExcel(e) {
        const file = e.target.files[0];
        if (!file || !state.selectedExamId) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          const wb = XLSX.read(evt.target.result, { type: 'binary' });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
          const currentCount = state.questions.filter(q => q.exam_id === state.selectedExamId).length;
          const items = rows.map((r, i) => ({
            exam_id: state.selectedExamId,
            order_number: parseInt(r.NO || (currentCount + i + 1), 10),
            question_text: String(r.SOAL || r.PERTANYAAN || '').trim(),
            image_url: '',
            option_a: String(r.OPSI_A || r.A || '').trim(),
            option_b: String(r.OPSI_B || r.B || '').trim(),
            option_c: String(r.OPSI_C || r.C || '').trim(),
            option_d: String(r.OPSI_D || r.D || '').trim(),
            correct_option: String(r.KUNCI || 'A').trim().toUpperCase().charAt(0)
          })).filter(x => x.question_text);

          if (items.length > 0) {
            if (IS_PREVIEW) {
              items.forEach((it, idx) => state.questions.push({ id: 'q-xl-' + Date.now() + '-' + idx, ...it }));
            } else {
              await supabase.from('questions').insert(items);
              await loadAllAdminData();
            }
          }
          showToast(`Berhasil mengimpor ${items.length} soal berurutan dari Excel`, 'success');
          renderApp();
        };
        reader.readAsBinaryString(file);
      },

      importQuestionsWord(e) {
        const file = e.target.files[0];
        if (!file || !state.selectedExamId) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          const result = await mammoth.extractRawText({ arrayBuffer: evt.target.result });
          await parseStructuredQuestionsText(result.value);
        };
        reader.readAsArrayBuffer(file);
      },

      async processGFormImport() {
        const raw = document.getElementById('gform-raw-text').value;
        await parseStructuredQuestionsText(raw);
        document.getElementById('modal-import-gform').classList.add('hidden');
      },

      // ----------------- PENGAWASAN & EKSPOR NILAI -----------------
      async unlockStudentSession(sessionId) {
        if (IS_PREVIEW) {
          const ses = state.exam_sessions.find(s => s.id === sessionId);
          if (ses) { ses.status = 'in_progress'; ses.violation_count = 0; }
        } else {
          await supabase.from('exam_sessions').update({ status: 'in_progress', violation_count: 0 }).eq('id', sessionId);
          await loadAllAdminData();
        }
        showToast('Blokir sesi siswa dibuka kembali', 'success');
        renderApp();
      },

      async resetStudentSession(sessionId) {
        if (!confirm('Reset sesi ujian siswa ini agar dapat mengulang dari awal?')) return;
        if (IS_PREVIEW) {
          state.exam_sessions = state.exam_sessions.filter(s => s.id !== sessionId);
        } else {
          await supabase.from('exam_sessions').delete().eq('id', sessionId);
          await loadAllAdminData();
        }
        showToast('Sesi ujian siswa berhasil direset', 'info');
        renderApp();
      },

      exportResultsExcel() {
        const rows = state.exam_sessions.map((ses, idx) => {
          const std = state.students.find(s => s.id === ses.student_id) || {};
          const ex = state.exams.find(e => e.id === ses.exam_id) || {};
          return {
            NO: idx + 1,
            NISN: std.nisn || '-',
            NAMA_SISWA: std.name || '-',
            KELAS: std.class_name || '-',
            MATA_PELAJARAN: ex.subject || '-',
            PAKET_UJIAN: ex.title || '-',
            PELANGGARAN_PINDAH_LAYAR: ses.violation_count || 0,
            STATUS: ses.status,
            NILAI_AKHIR: ses.score ?? 0
          };
        });
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Rekap_Nilai');
        XLSX.writeFile(wb, 'Rekap_Nilai_Ujian_Sekolah.xlsx');
      },

      // ----------------- ALUR PENGERJAAN UJIAN SISWA (BERURUTAN & FULLSCREEN) -----------------
      async startStudentExam(examId) {
        const ex = state.exams.find(e => e.id === examId);
        if (!ex) return;

        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen().catch(() => {});
        }

        let questions = [];
        if (IS_PREVIEW) {
          questions = state.questions
            .filter(q => q.exam_id === examId)
            .sort((a, b) => (a.order_number || 0) - (b.order_number || 0));
        } else {
          const { data } = await supabase
            .from('questions')
            .select('*')
            .eq('exam_id', examId)
            .order('order_number', { ascending: true });
          questions = data || [];
        }

        let session = state.exam_sessions.find(s => s.student_id === state.currentUser.id && s.exam_id === examId);
        if (!session) {
          const newSes = {
            student_id: state.currentUser.id,
            exam_id: examId,
            answers: {},
            score: null,
            violation_count: 0,
            status: 'in_progress',
            started_at: new Date().toISOString()
          };
          if (IS_PREVIEW) {
            session = { id: 'ses-' + Date.now(), ...newSes };
            state.exam_sessions.push(session);
          } else {
            const { data } = await supabase.from('exam_sessions').insert([newSes]).select().single();
            session = data;
            state.exam_sessions.push(session);
          }
        }

        state.activeExam = ex;
        state.activeQuestions = questions;
        state.activeSession = session;
        state.currentQuestionIndex = 0;
        state.remainingSeconds = (ex.duration_minutes || 60) * 60;

        attachAntiCheatListeners();
        if (state.examTimerInterval) clearInterval(state.examTimerInterval);
        state.examTimerInterval = setInterval(() => {
          state.remainingSeconds--;
          const timerEl = document.getElementById('exam-timer-display');
          if (timerEl) {
            const m = String(Math.floor(state.remainingSeconds / 60)).padStart(2, '0');
            const s = String(state.remainingSeconds % 60).padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
          }
          if (state.remainingSeconds <= 0) {
            clearInterval(state.examTimerInterval);
            window.app.submitExamNow();
          }
        }, 1000);

        renderApp();
      },

      async selectAnswer(questionId, optionLetter) {
        if (!state.activeSession) return;
        state.activeSession.answers = { ...state.activeSession.answers, [questionId]: optionLetter };
        if (!IS_PREVIEW && supabase) {
          await supabase.from('exam_sessions').update({ answers: state.activeSession.answers }).eq('id', state.activeSession.id);
        }
        renderApp();
      },

      toggleDoubtful(questionId) {
        state.doubtfulQuestions[questionId] = !state.doubtfulQuestions[questionId];
        renderApp();
      },

      navigateQuestion(delta) {
        const next = state.currentQuestionIndex + delta;
        if (next >= 0 && next < state.activeQuestions.length) {
          state.currentQuestionIndex = next;
          renderApp();
        }
      },

      jumpToQuestion(index) {
        state.currentQuestionIndex = index;
        renderApp();
      },

      confirmSubmitExam() {
        const answeredCount = Object.keys(state.activeSession?.answers || {}).length;
        const total = state.activeQuestions.length;
        if (!confirm(`Anda telah menjawab ${answeredCount} dari ${total} soal.\nYakin ingin mengakhiri ujian dan mengirim jawaban sekarang?`)) return;
        window.app.submitExamNow();
      },

      async submitExamNow() {
        if (!state.activeSession || !state.activeExam) return;
        clearInterval(state.examTimerInterval);

        const answers = state.activeSession.answers || {};
        let correct = 0;
        state.activeQuestions.forEach(q => {
          if (answers[q.id] === q.correct_option) correct++;
        });
        const total = state.activeQuestions.length || 1;
        const score = Math.round((correct / total) * 100);

        state.activeSession.score = score;
        state.activeSession.status = 'completed';
        state.activeSession.submitted_at = new Date().toISOString();

        if (!IS_PREVIEW && supabase) {
          await supabase.from('exam_sessions').update({
            answers,
            score,
            status: 'completed',
            submitted_at: state.activeSession.submitted_at
          }).eq('id', state.activeSession.id);
        }

        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }

        state.activeExam = null;
        showToast('Jawaban ujian Anda berhasil dikirim!', 'success');
        renderApp();
      }
    };

    // Parser Teks Soal dari Word (.docx) & Google Form secara Berurutan
    async function parseStructuredQuestionsText(rawText) {
      if (!rawText || !state.selectedExamId) return;
      const blocks = rawText.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
      const existingCount = state.questions.filter(q => q.exam_id === state.selectedExamId).length;
      const newQuestions = [];

      blocks.forEach((block) => {
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
        if (lines.length < 5) return;
        const qText = lines[0].replace(/^\d+[\.\)]\s*/, '');
        let a = '', b = '', c = '', d = '', key = 'A';
        lines.slice(1).forEach(line => {
          if (/^A[\.\)]\s*/i.test(line)) a = line.replace(/^A[\.\)]\s*/i, '');
          else if (/^B[\.\)]\s*/i.test(line)) b = line.replace(/^B[\.\)]\s*/i, '');
          else if (/^C[\.\)]\s*/i.test(line)) c = line.replace(/^C[\.\)]\s*/i, '');
          else if (/^D[\.\)]\s*/i.test(line)) d = line.replace(/^D[\.\)]\s*/i, '');
          else if (/^(KUNCI|JAWABAN|KEY)\s*[:=]\s*/i.test(line)) {
            key = line.replace(/^(KUNCI|JAWABAN|KEY)\s*[:=]\s*/i, '').trim().toUpperCase().charAt(0) || 'A';
          }
        });
        if (qText && a && b) {
          newQuestions.push({
            exam_id: state.selectedExamId,
            order_number: existingCount + newQuestions.length + 1,
            question_text: qText,
            image_url: '',
            option_a: a,
            option_b: b,
            option_c: c || '-',
            option_d: d || '-',
            correct_option: ['A', 'B', 'C', 'D'].includes(key) ? key : 'A'
          });
        }
      });

      if (newQuestions.length > 0) {
        if (IS_PREVIEW) {
          newQuestions.forEach((nq, i) => state.questions.push({ id: 'q-imp-' + Date.now() + '-' + i, ...nq }));
        } else {
          await supabase.from('questions').insert(newQuestions);
          await loadAllAdminData();
        }
        showToast(`Berhasil mengimpor ${newQuestions.length} butir soal secara berurutan!`, 'success');
        renderApp();
      } else {
        showToast('Format soal tidak dikenali. Pastikan terdapat opsi A, B, C, D dan KUNCI.', 'warning');
      }
    }

    // Inisialisasi Aplikasi & Cek Sesi Login Admin
    async function bootstrapApp() {
      registerDynamicPWA();
      if (!IS_PREVIEW && supabase) {
        try {
          const { data } = await supabase.auth.getSession();
          if (data?.session?.user) {
            state.role = 'admin';
            state.currentUser = data.session.user;
            await loadAllAdminData();
          }
        } catch (e) {}
      }
      renderApp();
    }

    bootstrapApp();
  </script>
