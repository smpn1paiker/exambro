  <style>

       FULLSCREEN OVERLAY UNTUK BLOGGER (TANPA EDIT XML) & GLASSMORPHISM
       ============================================================================ */
    #exambro-root-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 50%, #f1f5f9 100%);
      font-family: 'Inter', sans-serif;
      color: #0f172a;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Proteksi Anti-Copy & Seleksi saat Mode Ujian */
    .exambro-protected {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    /* Glassmorphism Utilities */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

    }

    .glass-header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }

    /* Tata Letak Responsif: Desktop Sidebar vs Mobile Bottom Nav */
    .admin-sidebar {
      display: flex;
      flex-direction: column;
      width: 270px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
    }

    .admin-main-content {
      margin-left: 270px;
      min-height: 100vh;
      padding-bottom: 2rem;
    }

    .admin-bottom-nav {
      display: none;
    }

    @media (max-width: 1023px) {
      .admin-sidebar {
        display: none !important;
      }
      .admin-main-content {
        margin-left: 0 !important;
        padding-bottom: 5.5rem !important;
      }
      .admin-bottom-nav {
        display: flex !important;
        position: fixed;
        bottom: 0.75rem;
        left: 0.75rem;
        right: 0.75rem;
        z-index: 50;
        background: rgba(255, 255, 255, 0.95);

      display: none;

      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    /* Pengaturan Cetak Kartu Ujian */
    @media print {
      body * {
        visibility: hidden;
      }
      #exambro-root-wrapper {
        position: static !important;
        overflow: visible !important;
        background: #ffffff !important;
      }
      #print-area-cards, #print-area-cards * {
        visibility: visible;
      }
      #print-area-cards {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 0;
        margin: 0;
      }
      .no-print {
        display: none !important;
      }

        break-inside: avoid;
        page-break-inside: avoid;
        border: 1.5px solid #1e293b !important;
        box-shadow: none !important;
      }

            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));

          `;
          const blob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(blob);

            action_type: newLog.action_type,

    // ============================================================================
    // UTILITAS UI: TOAST, MODAL, & AUDIO ALARM ANTI-CURANG
    // ============================================================================
    const showToast = (message, type = 'info') => {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-red-600 text-white border-red-500',
        warning: 'bg-amber-500 text-slate-950 border-amber-400',
        info: 'bg-slate-900 text-white border-slate-700'
      };
      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-xmark',
        warning: 'fa-triangle-exclamation',
        info: 'fa-circle-info'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl border shadow-xl text-sm font-medium transition-all duration-300 ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <i class="fa-solid ${icons[type] || icons.info} text-lg shrink-0"></i>
        <div class="flex-1 leading-snug">${message}</div>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    };

    const openModal = (htmlContent) => {
      const backdrop = document.getElementById('custom-modal-backdrop');
      const content = document.getElementById('custom-modal-content');
      if (backdrop && content) {
        content.innerHTML = htmlContent;
        backdrop.classList.remove('hidden');
      }
    };

    const closeModal = () => {
      const backdrop = document.getElementById('custom-modal-backdrop');
      if (backdrop) backdrop.classList.add('hidden');
    };

    // Modal Konfirmasi Tindakan (Mencegah penghapusan/perubahan tidak sengaja)
    let pendingConfirmCallback = null;
    const openConfirmModal = ({ title, message, confirmText = 'Ya, Lanjutkan', confirmColor = 'bg-blue-600 hover:bg-blue-700', icon = 'fa-circle-question', onConfirm }) => {
      pendingConfirmCallback = onConfirm;
      openModal(`
        <div class="text-center space-y-4">
          <div class="w-16 h-16 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto">

          </div>
          <h3 class="text-xl font-extrabold text-slate-900">${escapeHtml(title)}</h3>
          <p class="text-sm text-slate-600 leading-relaxed">${message}</p>
          <div class="grid grid-cols-2 gap-3 pt-2">
            <button type="button" onclick="window.app.closeModal()" class="py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs sm:text-sm">

            </button>

        </div>
      `);

    // Bunyi Sirine Peringatan menggunakan Web Audio API (Tanpa File Eksternal)
    const playSecurityAlarmSound = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(640, ctx.currentTime);
        osc.frequency.setValueAtTime(440, ctx.currentTime + 0.18);
        osc.frequency.setValueAtTime(640, ctx.currentTime + 0.36);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) {
        // Abaikan jika browser memblokir autoplay audio
      }
    };

    const escapeHtml = (str) => {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    };

    // ============================================================================
    // LAYER DATA & INTEGRASI SUPABASE (HYBRID AUTH & CRUD REAL)
    // ============================================================================
    const syncDataFromSupabase = async () => {
      if (IS_PREVIEW) return;
      if (!supabase) {
        showToast('Konfigurasi SUPABASE_URL dan SUPABASE_ANON_KEY belum diisi!', 'error');

      }

      try {
        const [ayRes, clsRes, subRes, tchRes, stdRes, exmRes, qstRes, sesRes, logRes] = await Promise.all([
          supabase.from('academic_years').select('*').order('created_at', { ascending: false }),
          supabase.from('classes').select('*').order('level', { ascending: true }).order('class_name', { ascending: true }),
          supabase.from('subjects').select('*').order('code', { ascending: true }),
          supabase.from('teachers').select('*').order('name', { ascending: true }),
          supabase.from('students').select('*').order('class_name', { ascending: true }).order('name', { ascending: true }),
          supabase.from('exams').select('*').order('created_at', { ascending: false }),
          supabase.from('questions').select('*').order('order_number', { ascending: true }),
          supabase.from('exam_sessions').select('*').order('started_at', { ascending: false }),
          supabase.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(200)
        ]);

        if (!ayRes.error) state.academic_years = ayRes.data || [];
        if (!clsRes.error) state.classes = clsRes.data || [];
        if (!subRes.error) state.subjects = subRes.data || [];
        if (!tchRes.error) state.teachers = tchRes.data || [];
        if (stdRes.error) throw stdRes.error;
        if (exmRes.error) throw exmRes.error;
        if (qstRes.error) throw qstRes.error;
        if (sesRes.error) throw sesRes.error;

        state.students = stdRes.data || [];
        state.exams = exmRes.data || [];
        state.questions = qstRes.data || [];
        state.exam_sessions = sesRes.data || [];
        if (!logRes.error) state.audit_logs = logRes.data || [];
      } catch (err) {
        showToast('Gagal memuat data dari Supabase: ' + err.message, 'error');
      }
    };

    // ============================================================================
    // SISTEM KEAMANAN EXAMBRO (FULLSCREEN, ANTI-TAB SWITCH, ANTI-SCREENSHOT)
    // ============================================================================
    const enterFullscreenMode = async () => {
      try {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          await elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          await elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          await elem.msRequestFullscreen();
        }
      } catch (e) {
        // Tetap lanjutkan jika perangkat tidak mengizinkan fullscreen API
      }
    };

    const exitFullscreenMode = async () => {
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          await document.exitFullscreen();
        }
      } catch (e) {}
    };

    const recordExamViolation = async (reasonText) => {
      if (!state.isExamRunning || !state.activeSession || !state.activeExam) return;

      // Cegah pencatatan ganda dalam jeda 1.5 detik (mis. blur + visibilitychange berbarengan)
      const now = Date.now();
      if (now - state.lastViolationTimestamp < 1500) return;
      state.lastViolationTimestamp = now;

      playSecurityAlarmSound();

      state.activeSession.violation_count = (state.activeSession.violation_count || 0) + 1;
      const currentViolations = state.activeSession.violation_count;
      const maxViolations = state.activeExam.max_violations || 3;

      // Update ke Supabase jika mode produksi
      if (!IS_PREVIEW && supabase) {
        try {
          await supabase
            .from('exam_sessions')
            .update({ violation_count: currentViolations })
            .eq('id', state.activeSession.id);
        } catch (e) {}
      }

      // Cek apakah melebihi batas toleransi pelanggaran
      if (currentViolations >= maxViolations) {
        document.getElementById('security-blur-shield').style.display = 'none';
        await forceFinishExamByViolation(reasonText);
        return;
      }

      // Tampilkan Perisai Blur Peringatan
      const shield = document.getElementById('security-blur-shield');
      const msgEl = document.getElementById('security-shield-message');
      const countEl = document.getElementById('security-violation-counter');

      if (shield && msgEl && countEl) {
        msgEl.textContent = `${reasonText} Sistem mencatat aktivitas ini sebagai pelanggaran ujian. Jika mencapai batas maksimal, ujian Anda akan dikunci otomatis!`;
        countEl.textContent = `${currentViolations} / ${maxViolations}`;
        shield.style.display = 'flex';
      }
    };

    const forceFinishExamByViolation = async (reasonText) => {
      if (!state.activeSession) return;
      clearInterval(state.timerInterval);
      state.isExamRunning = false;

      // Hitung skor terakhir yang sudah dijawab
      const score = calculateExamScore(state.activeExam.id, state.activeSession.answers);
      state.activeSession.score = score;
      state.activeSession.status = 'blocked';
      state.activeSession.submitted_at = new Date().toISOString();

      if (!IS_PREVIEW && supabase) {
        try {
          await supabase
            .from('exam_sessions')
            .update({
              score,
              status: 'blocked',
              violation_count: state.activeSession.violation_count,
              submitted_at: state.activeSession.submitted_at
            })
            .eq('id', state.activeSession.id);
        } catch (e) {}
      }

      exitFullscreenMode();
      renderApp();
      openModal(`
        <div class="text-center">
          <div class="w-16 h-16 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-lock text-3xl"></i>
          </div>
          <h3 class="text-xl font-extrabold text-slate-900 mb-2">Sesi Ujian Dikunci Otomatis!</h3>
          <p class="text-sm text-slate-600 mb-4">
            ${escapeHtml(reasonText)} Anda telah melampaui batas maksimal pelanggaran (<strong>${state.activeSession.violation_count}x</strong>). Jawaban Anda telah disimpan dan sesi dikunci. Silakan hubungi Pengawas/Admin.
          </p>
          <button onclick="window.app.closeModal()" class="w-full py-3 rounded-xl bg-slate-900 text-white font-bold text-sm">
            Mengerti
          </button>
        </div>
      `);
    };

    const setupAntiCheatListeners = () => {
      // 1. Deteksi Pindah Tab / Minimize Aplikasi
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state.isExamRunning) {
          recordExamViolation('Terdeteksi meninggalkan layar ujian atau berpindah aplikasi/tab.');
        }
      });

      // 2. Deteksi Kehilangan Fokus Jendela (Split Screen / Floating App / Notifikasi Interaktif)
      window.addEventListener('blur', () => {
        if (state.isExamRunning) {
          recordExamViolation('Layar ujian kehilangan fokus (indikasi membuka jendela lain atau layar belah/split-screen).');
        }
      });

      // 3. Deteksi Keluar dari Mode Layar Penuh (Fullscreen)
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && state.isExamRunning) {
          recordExamViolation('Anda keluar dari mode layar penuh (Fullscreen Exambro).');
        }
      });

      // 4. Blokir Klik Kanan / Long Press Menu saat Ujian
      document.addEventListener('contextmenu', (e) => {
        if (state.isExamRunning) {
          e.preventDefault();
          showToast('Menu klik kanan/tahan dinonaktifkan selama ujian berlangsung!', 'warning');
        }
      });

      // 5. Deteksi Tombol Screenshot / PrintScreen / Copy / Inspect
      window.addEventListener('keydown', (e) => {
        if (!state.isExamRunning) return;

        const isPrintScreen = e.key === 'PrintScreen' || e.keyCode === 44;
        const isCopyOrInspect =
          (e.ctrlKey && ['c', 'u', 's', 'p'].includes(e.key.toLowerCase())) ||
          (e.metaKey && e.shiftKey && ['s', '3', '4', '5'].includes(e.key.toLowerCase())) ||
          e.key === 'F12';

        if (isPrintScreen || isCopyOrInspect) {
          e.preventDefault();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText('Tangkapan layar dilarang oleh Exambro CBT!').catch(() => {});
          }
          recordExamViolation('Terdeteksi percobaan tangkapan layar (Screenshot) atau pintasan keyboard terlarang.');
        }
      });
    };

    // ============================================================================
    // LOGIKA PERHITUNGAN SKOR & TIMER UJIAN
    // ============================================================================
    const calculateExamScore = (examId, answersObj = {}) => {
      const qList = state.questions.filter((q) => String(q.exam_id) === String(examId));
      if (qList.length === 0) return 0;
      let correct = 0;
      qList.forEach((q) => {
        const ans = answersObj[q.id];
        if (ans && ans.toUpperCase() === String(q.correct_option).toUpperCase()) {
          correct++;
        }
      });
      return Math.round((correct / qList.length) * 100);
    };

    const formatTimer = (sec) => {
      const s = Math.max(0, Math.floor(sec));
      const hrs = Math.floor(s / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    };

    const renderMasterStudentsTab = () => {
      const activeClasses = state.classes.filter((c) => !c.is_archived);

    // PARSER PINTAR IMPOR SOAL (WORD .DOCX, EXCEL .XLSX/.CSV, & GOOGLE FORM)
    // ============================================================================
    const parseRawTextToQuestions = (rawText) => {
      // Mendukung format teks terstruktur dari Word (.docx) maupun salinan Google Form:
      // Pola baris soal diikuti A. ... B. ... C. ... D. ... dan Kunci/Jawaban: A/B/C/D
      const lines = rawText
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter((l) => l.length > 0);

      const parsed = [];
      let current = null;

      const pushCurrentIfValid = () => {
        if (
          current &&
          current.question_text &&
          current.option_a &&
          current.option_b &&
          current.option_c &&
          current.option_d
        ) {
          if (!['A', 'B', 'C', 'D'].includes(current.correct_option)) {
            current.correct_option = 'A';
          }
          parsed.push(current);
        }
      };

      for (const line of lines) {
        const optMatch = line.match(/^([A-Da-d])[\.\)\-\:]\s*(.+)$/);
        const keyMatch = line.match(/^(?:kunci|jawaban|kunci\s*jawaban|answer|correct)\s*[\:\=]?\s*([A-Da-d])/i);

        if (keyMatch && current) {
          current.correct_option = keyMatch[1].toUpperCase();
        } else if (optMatch && current) {
          const letter = optMatch[1].toLowerCase();
          current['option_' + letter] = optMatch[2].trim();
        } else {
          // Jika current sudah punya opsi D, berarti baris baru ini adalah soal berikutnya
          if (current && current.option_d) {
            pushCurrentIfValid();
            current = null;
          }

          const cleanedQuestion = line.replace(/^\d+[\.\)\-]\s*/, '').trim();
          if (!current) {
            current = {
              question_text: cleanedQuestion,
              image_url: '',
              option_a: '',
              option_b: '',
              option_c: '',
              option_d: '',
              correct_option: 'A'
            };
          } else if (!current.option_a) {
            current.question_text += '\n' + cleanedQuestion;
          }
        }
      }
      pushCurrentIfValid();
      return parsed;
    };

    const parseRowsArrayToQuestions = (rows) => {
      // Mendukung Excel (.xlsx/.csv) & Google Form Spreadsheet Export
      const parsed = [];
      if (!rows || rows.length === 0) return parsed;

      rows.forEach((row) => {
        // Normalisasi key objek menjadi lowercase
        const norm = {};
        Object.keys(row).forEach((k) => {
          norm[k.trim().toLowerCase()] = String(row[k] ?? '').trim();
        });

        const qText = norm['soal'] || norm['pertanyaan'] || norm['question'] || norm['question_text'] || '';
        const optA = norm['opsi_a'] || norm['a'] || norm['pilihan a'] || norm['option_a'] || '';
        const optB = norm['opsi_b'] || norm['b'] || norm['pilihan b'] || norm['option_b'] || '';
        const optC = norm['opsi_c'] || norm['c'] || norm['pilihan c'] || norm['option_c'] || '';
        const optD = norm['opsi_d'] || norm['d'] || norm['pilihan d'] || norm['option_d'] || '';
        let key = (norm['kunci'] || norm['jawaban'] || norm['kunci_jawaban'] || norm['correct_option'] || 'A').toUpperCase().trim();
        const imgUrl = norm['gambar'] || norm['image_url'] || '';

        if (key.length > 1) key = key.charAt(0);
        if (!['A', 'B', 'C', 'D'].includes(key)) key = 'A';

        if (qText && optA && optB && optC && optD) {
          parsed.push({
            question_text: qText,
            image_url: imgUrl,
            option_a: optA,
            option_b: optB,
            option_c: optC,
            option_d: optD,
            correct_option: key
          });
        }
      });

      return parsed;
    };

    // Kompresi gambar upload ke DataURL agar ringan disimpan di database
    const convertImageFileToDataUrl = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxW = 800;
            let w = img.width;
            let h = img.height;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

      handleStudentExcelImport: (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            const activePeriod = getActiveAcademicYear();

            let importedCount = 0;
            let skippedDuplicates = 0;
            const newRecords = [];

            rows.forEach((r, idx) => {
              const norm = {};
              Object.keys(r).forEach((k) => { norm[k.trim().toLowerCase()] = String(r[k] ?? '').trim(); });
              const nisn = norm['nisn'] || '';
              const name = norm['nama'] || norm['name'] || norm['nama lengkap'] || '';
              const gender = (norm['jk'] || norm['jenis kelamin'] || 'L').toUpperCase().startsWith('P') ? 'P' : 'L';
              const class_name = norm['kelas'] || norm['class'] || 'VII.1';
              const username = norm['username'] || nisn;
              const exam_number = norm['nomor_ujian'] || `UJ-IMP-${idx + 1}`;

              if (!nisn || !name) return;

              const existsInState = state.students.some((s) => s.nisn === nisn || s.username === username);
              const existsInBatch = newRecords.some((s) => s.nisn === nisn || s.username === username);

              if (existsInState || existsInBatch) {
                skippedDuplicates++;
                return;
              }

              newRecords.push({
                nisn,
                username,
                exam_number,
                name,
                gender,
                class_name,
                academic_year: activePeriod.year_name,
                password: norm['password'] || 'siswa123',
                can_take_exam: true,
                is_archived: false,
                created_at: new Date().toISOString()
              });
              importedCount++;
            });

            if (newRecords.length === 0) {
              showToast(`Tidak ada siswa baru yang disimpan (${skippedDuplicates} duplikat NISN/Username dilewati).`, 'warning');
              return;
            }

            if (IS_PREVIEW) {
              newRecords.forEach((rec, i) => state.students.push({ id: 'std-imp-' + Date.now() + '-' + i, ...rec }));
            } else if (supabase) {
              const { error } = await supabase.from('students').insert(newRecords);
              if (error) throw error;
              await syncDataFromSupabase();
            }

            await recordAuditLog('BULK_IMPORT', 'Data Siswa', `Impor massal ${importedCount} siswa (${skippedDuplicates} duplikat dilewati)`);
            closeModal();
            showToast(`Berhasil mengimpor ${importedCount} siswa! (${skippedDuplicates} duplikat otomatis dilewati)`, 'success');
            renderApp();
          } catch (err) {
            showToast('Gagal mengimpor file siswa: ' + err.message, 'error');
          }
        };
        reader.readAsArrayBuffer(file);

      // ==========================================================================
      // CONTROLLER MULAI & PENGERJAAN UJIAN SISWA (FULLSCREEN & TIMER)
      // ==========================================================================
      startStudentExam: async (examId) => {
        const exam = state.exams.find((e) => String(e.id) === String(examId));
        if (!exam) return;

        const qList = state.questions
          .filter((q) => String(q.exam_id) === String(exam.id))
          .sort((a, b) => (a.order_number || 0) - (b.order_number || 0));

        if (qList.length === 0) {
          showToast('Soal untuk ujian ini belum tersedia. Hubungi Pengawas.', 'warning');
          return;
        }

        let session = state.exam_sessions.find(
          (s) => String(s.exam_id) === String(exam.id) && String(s.student_id) === String(state.currentUser.id)
        );

        if (session && session.status === 'blocked') {
          showToast('Sesi ujian Anda terkunci karena pelanggaran. Hubungi Pengawas!', 'error');
          return;
        }

        if (!session) {
          const newSessionPayload = {
            student_id: state.currentUser.id,
            exam_id: exam.id,
            answers: {},
            score: null,
            violation_count: 0,
            status: 'in_progress',
            started_at: new Date().toISOString(),
            submitted_at: null
          };

          if (IS_PREVIEW) {
            session = { id: 'ses-' + Date.now(), ...newSessionPayload };
            state.exam_sessions.unshift(session);
          } else if (supabase) {
            try {
              const { data, error } = await supabase
                .from('exam_sessions')
                .insert([newSessionPayload])
                .select()
                .single();
              if (error) throw error;
              session = data;
              state.exam_sessions.unshift(session);
            } catch (err) {
              showToast('Gagal memulai sesi ujian: ' + err.message, 'error');
              return;
            }
          }
        }

        await enterFullscreenMode();

        state.activeExam = exam;
        state.activeSession = session;
        state.examQuestions = qList;
        state.currentQuestionIndex = 0;
        state.doubtFlags = {};
        state.isExamRunning = true;
        state.remainingSeconds = (exam.duration_minutes || 60) * 60;

        clearInterval(state.timerInterval);
        state.timerInterval = setInterval(() => {
          if (!state.isExamRunning) return;
          state.remainingSeconds--;
          const timerEl = document.getElementById('exam-timer-display');
          if (timerEl) timerEl.textContent = formatTimer(state.remainingSeconds);

          if (state.remainingSeconds <= 0) {
            window.app.submitStudentExamFinal(true);
          }
        }, 1000);

        renderApp();
      },

        await enterFullscreenMode();
        const shield = document.getElementById('security-blur-shield');

              .from('exam_sessions')
              .update({

                score,
                status: 'completed',

              })
              .eq('id', state.activeSession.id);
          } catch (err) {
            showToast('Gagal menyimpan ke server: ' + err.message, 'error');

          {
            soal: 'Planet terdekat dengan Matahari dalam tata surya kita adalah...',
            opsi_a: 'Venus',
            opsi_b: 'Merkurius',
            opsi_c: 'Mars',
            opsi_d: 'Bumi',
            kunci: 'B',
            gambar: ''
          },
          {
            soal: 'Rumus kimia dari senyawa air murni adalah...',
            opsi_a: 'CO2',
            opsi_b: 'O2',
            opsi_c: 'H2O',
            opsi_d: 'NaCl',
            kunci: 'C',
            gambar: ''
          }
        ];
        const ws = XLSX.utils.json_to_sheet(sampleRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Template_Soal_PG');
        XLSX.writeFile(wb, 'Template_Impor_Soal_Exambro.xlsx');
      },

      handleExcelImportFile: (e, examId) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet);
            const parsedQuestions = parseRowsArrayToQuestions(rows);

            if (parsedQuestions.length === 0) {
              showToast('Tidak ditemukan baris soal valid. Pastikan kolom bernama: soal, opsi_a, opsi_b, opsi_c, opsi_d, kunci.', 'warning');
              return;
            }
            await window.app.bulkSaveImportedQuestions(examId, parsedQuestions);
          } catch (err) {
            showToast('Gagal membaca file Excel: ' + err.message, 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      },

      handleWordImportFile: (e, examId) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const result = await mammoth.extractRawText({ arrayBuffer: evt.target.result });
            const parsedQuestions = parseRawTextToQuestions(result.value || '');
            if (parsedQuestions.length === 0) {
              showToast('Format soal di file Word belum sesuai pola A. B. C. D. dan Kunci.', 'warning');
              return;
            }
            await window.app.bulkSaveImportedQuestions(examId, parsedQuestions);
          } catch (err) {
            showToast('Gagal membaca dokumen Word (.docx): ' + err.message, 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      },

      handleGoogleFormTextImport: async (examId) => {
        const raw = document.getElementById('import-gform-textarea')?.value || '';
        const parsedQuestions = parseRawTextToQuestions(raw);
        if (parsedQuestions.length === 0) {
          showToast('Teks belum sesuai format! Pastikan ada pertanyaan, opsi A-D, dan Kunci.', 'warning');
          return;
        }
        await window.app.bulkSaveImportedQuestions(examId, parsedQuestions);
      },

      bulkSaveImportedQuestions: async (examId, questionsArray) => {
        const startOrder = state.questions.filter((q) => String(q.exam_id) === String(examId)).length;
        const payloads = questionsArray.map((q, idx) => ({
          exam_id: examId,
          question_text: q.question_text,
          image_url: q.image_url || '',
          option_a: q.option_a,
          option_b: q.option_b,
          option_c: q.option_c,
          option_d: q.option_d,
          correct_option: q.correct_option || 'A',
          order_number: startOrder + idx + 1
        }));

        if (IS_PREVIEW) {
          payloads.forEach((p, i) => {
            state.questions.push({ id: 'qst-imp-' + Date.now() + '-' + i, ...p });
          });
          closeModal();
          showToast(`Berhasil mengimpor ${payloads.length} butir soal PG!`, 'success');
          renderApp();
          return;
        }

        try {
          const { error } = await supabase.from('questions').insert(payloads);
          if (error) throw error;
          await syncDataFromSupabase();
          closeModal();
          showToast(`Berhasil mengimpor ${payloads.length} butir soal ke Supabase!`, 'success');
          renderApp();
        } catch (err) {
          showToast('Gagal menyimpan soal impor: ' + err.message, 'error');
        }
      },

      // ==========================================================================
      // TINDAKAN PENGAWAS & EKSPOR REKAP NILAI
      // ==========================================================================
      unlockStudentSession: async (sessionId) => {
        if (IS_PREVIEW) {
          const ses = state.exam_sessions.find((s) => String(s.id) === String(sessionId));
          if (ses) {
            ses.status = 'in_progress';
            ses.violation_count = 0;
          }
          showToast('Kunci sesi siswa dibuka & pelanggaran direset ke 0!', 'success');
          renderApp();
          return;
        }

        try {
          const { error } = await supabase
            .from('exam_sessions')
            .update({ status: 'in_progress', violation_count: 0 })
            .eq('id', sessionId);
          if (error) throw error;
          await syncDataFromSupabase();
          showToast('Sesi siswa berhasil dibuka kembali!', 'success');
          renderApp();
        } catch (err) {
          showToast('Gagal membuka kunci sesi: ' + err.message, 'error');
        }
      },

      deleteExamSession: async (sessionId) => {
        if (IS_PREVIEW) {
          state.exam_sessions = state.exam_sessions.filter((s) => String(s.id) !== String(sessionId));
          showToast('Sesi ujian siswa berhasil direset.', 'info');
          renderApp();
          return;
        }

        try {
          const { error } = await supabase.from('exam_sessions').delete().eq('id', sessionId);
          if (error) throw error;
          await syncDataFromSupabase();
          showToast('Sesi ujian siswa berhasil direset!', 'info');
          renderApp();
        } catch (err) {
          showToast('Gagal mereset sesi: ' + err.message, 'error');
        }
      },

      setResultExamFilter: (val) => {
        state.resultExamFilter = val;
        renderApp();
      },

      exportResultsToExcel: () => {
        if (typeof XLSX === 'undefined') {
          showToast('Pustaka Excel belum siap.', 'warning');
          return;
        }
        const filteredSessions = state.resultExamFilter === 'ALL'
          ? state.exam_sessions
          : state.exam_sessions.filter((s) => String(s.exam_id) === String(state.resultExamFilter));

        if (filteredSessions.length === 0) {
          showToast('Tidak ada data nilai untuk diekspor!', 'warning');
          return;
        }

        const exportRows = filteredSessions.map((ses, idx) => {
          const std = state.students.find((s) => String(s.id) === String(ses.student_id));
          const exm = state.exams.find((e) => String(e.id) === String(ses.exam_id));
          return {
            No: idx + 1,
            NISN: std?.nisn || '-',
            Nama_Siswa: std?.name || '-',
            Kelas: std?.class_name || '-',
            Mata_Pelajaran: exm?.subject || '-',
            Paket_Ujian: exm?.title || '-',
            Jumlah_Pelanggaran: ses.violation_count || 0,
            Status_Ujian: ses.status,
            Skor_Akhir: ses.score ?? 0,
            Waktu_Selesai: ses.submitted_at ? new Date(ses.submitted_at).toLocaleString('id-ID') : '-'
          };
        });

        const ws = XLSX.utils.json_to_sheet(exportRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Rekap_Nilai_Ujian');
        XLSX.writeFile(wb, 'Rekap_Nilai_Exambro_CBT.xlsx');
      }
    };

    // ============================================================================
    // INISIALISASI AWAL APLIKASI SAAT HALAMAN DIMUAT
    // ============================================================================
    const bootstrapApp = async () => {
      registerDynamicPWA();
      setupAntiCheatListeners();

      if (IS_PREVIEW) {
        initPreviewDummyData();
        renderApp();
        return;
      }

      // Jika Mode Produksi (IS_PREVIEW = false), cek session Supabase Auth untuk Admin
      if (supabase) {
        try {
          const { data } = await supabase.auth.getSession();
          if (data?.session?.user) {
            state.role = 'admin';
            state.currentUser = data.session.user;
          }
          await syncDataFromSupabase();
        } catch (e) {}
      }
      renderApp();
    };

    window.addEventListener('DOMContentLoaded', bootstrapApp);
  </script>
</body>
</html>
